# SPDX-License-Identifier: Apache-2.0
# Code generation for the Go server and agents. The plugins are tool dependencies in go.mod, so
# their versions match the runtime libraries. Generated code is committed (CONTRIBUTING.md,
# "Commits") and checked for drift by .github/scripts/check-buf.sh.
version: v2
clean: true
plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative

# SPDX-License-Identifier: Apache-2.0
# buf configuration for rpmgr's protobuf packages (docs/07-api.md, docs/12-testing-and-quality.md,
# "Continuous integration"). Run with .github/scripts/check-buf.sh.
version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  # The agent protocol keeps the names of docs/03 (service Control, AgentMessage,
  # ControllerMessage), which the STANDARD rules for service and request/response names reject
  # (docs/spikes/S4.md). The public API follows the rules.
  ignore_only:
    SERVICE_SUFFIX:
      - proto/rpmgr/agent
    RPC_REQUEST_STANDARD_NAME:
      - proto/rpmgr/agent
    RPC_RESPONSE_STANDARD_NAME:
      - proto/rpmgr/agent
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/rpmgr/agent
breaking:
  use:
    - FILE

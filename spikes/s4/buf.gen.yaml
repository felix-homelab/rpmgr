# SPDX-License-Identifier: Apache-2.0
# Plugins are installed with the versions pinned in README.md.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
  # grpc-go stubs: only for the comparison with the fallback named by the S4 rule.
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative

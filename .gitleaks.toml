# gitleaks configuration: the default rules (private keys, cloud and provider tokens, …) plus
# rpmgr's own token formats (docs/04-security.md, "Tokens"; docs/12-testing-and-quality.md,
# "Security testing"). Run locally with .github/scripts/check-secrets.sh.

title = "rpmgr"

[extend]
useDefault = true

# rpmgr_<kind>_<base62 of 32 random bytes>_<6-character CRC32 checksum>. The checksum makes
# matches reliable, so the rule needs no entropy threshold.
[[rules]]
id = "rpmgr-token"
description = "rpmgr enrollment, personal API, service-account or session token"
regex = '''\brpmgr_(?:enr|pat|sat|ses)_[0-9A-Za-z]{40,46}_[0-9A-Za-z]{6}\b'''
keywords = ["rpmgr_enr_", "rpmgr_pat_", "rpmgr_sat_", "rpmgr_ses_"]

# The sample nonce of RFC 6455, section 1.3, which WebSocket tests send as Sec-WebSocket-Key: a
# well-known example value, not a secret.
[[allowlists]]
description = "RFC 6455 sample WebSocket key"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# The seed of RFC 6238's test vectors, 12345678901234567890, in base32: TOTP tests compare it.
[[allowlists]]
description = "RFC 6238 test seed"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']

# Go code naming argon2's key derivation function, which the generic rule reads as a key.
[[allowlists]]
description = "argon2.IDKey"
regexes = ['''^argon2\.IDKey$''']

# Atlas migration checksums: hashes of the migration files.
[[allowlists]]
description = "Atlas migration checksums"
paths = ['''(^|/)internal/store/migrations/[^/]+/atlas\.sum$''']

# The container image ghcr.io/felix-homelab/rpmgr (RELEASING.md, "Release process";
# docs/10-operations.md, "Install"). When a release is published, its artifacts become the
# multi-arch image: checked and tested per platform first, then pushed with the tags RELEASING
# names, signed keylessly with cosign and given SLSA provenance. A pull request that changes the
# image or its checks runs the tests with binaries built from it.
name: images

on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - test/images/**
      - .github/scripts/check-images.sh
      - .github/scripts/image-tags.sh
      - .github/scripts/release-images.sh
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Register QEMU user-mode emulation for the other platforms
        run: >-
          docker run --rm --privileged
          mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          --install arm64,arm,riscv64
      - name: Image tests on every platform
        env:
          REQUIRE_EMULATION: "1"
        run: .github/scripts/check-images.sh

  publish:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # the image
      id-token: write # the keyless cosign signature and the provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/felix-homelab/rpmgr
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The release's artifacts, checked as release builds
        id: release
        env:
          REQUIRE_ROOTS: "1"
        run: |
          version=${TAG#v}
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # shellcheck source=/dev/null
          source .github/scripts/lib.sh
          patterns=(--pattern SHA256SUMS)
          for arch in "${RELEASE_ARCHES[@]}"; do
            patterns+=(--pattern "rpmgr-$version-linux-$arch")
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist "${patterns[@]}"
          .github/scripts/check-release-artifacts.sh dist "$version" "$GITHUB_SHA"
      - name: Register QEMU user-mode emulation for the other platforms
        run: >-
          docker run --rm --privileged
          mirror.gcr.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          --install arm64,arm,riscv64
      - name: Image tests on every platform, with the release's artifacts
        env:
          REQUIRE_EMULATION: "1"
          VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/check-images.sh dist "$VERSION"
      - name: Build, tag and push
        id: push
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          stable=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName | ltrimstr("v")')
          # shellcheck disable=SC2086 # one version per word
          mapfile -t tags < <(.github/scripts/image-tags.sh "$VERSION" $stable)
          echo "tags: ${tags[*]}"
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          docker buildx create --use --driver docker-container
          digest=$(.github/scripts/release-images.sh dist "$VERSION" "$GITHUB_SHA" "$IMAGE" "${tags[@]}")
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless cosign signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/felix-homelab/rpmgr
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

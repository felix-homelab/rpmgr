# Per-PR checks and checks on main (docs/12-testing-and-quality.md, "Continuous integration"):
# repository files, documents, workflows and secrets, the Go, protobuf, store, build and
# end-to-end stages, and the web UI. Every step is a script in .github/scripts/ that runs the same
# way locally.
# Until v1.0.0 (D64) a pull request runs only the stages its changes need, PostgreSQL 18 only and
# the cross-platform builds as vet only; a push to main runs only the stages that always run; the
# nightly run calls this workflow with full set to run everything.
# A merge queue group (merge_group) runs like a pull request: stages from the files the group
# changes, so the required checks report on the group's commit.
# Go test results are cached between runs of pull requests and merge groups only (GO_TEST_CACHE):
# the tests read only files and environment variables inside the module, which the go command
# tracks, so a cached pass equals a new one. Everything external is re-run by the nightly run and
# by pushes to main, which never cache (-count=1).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run every stage, on every PostgreSQL and with full builds
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests and merge groups let go test reuse cached results; see the header.
env:
  GO_TEST_CACHE: ${{ !inputs.full && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '1' || '' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      checks: ${{ steps.areas.outputs.checks }}
      ops: ${{ steps.areas.outputs.ops }}
      md: ${{ steps.areas.outputs.md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stages the changes need (D64)
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ $FULL == true ]]; then
            args=(--all)
          elif [[ $EVENT == pull_request ]]; then
            args=("$BASE" "$HEAD")
          elif [[ $EVENT == merge_group ]]; then
            args=("$GROUP_BASE" "$GROUP_HEAD")
          else
            args=(--none)
          fi
          .github/scripts/changed-areas.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  # lint and docs are required checks: they run even when the changes job fails, and then run
  # every step.
  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: .github/scripts/check-spdx.sh
      - name: Workflows
        if: ${{ !cancelled() }}
        run: .github/scripts/check-workflows.sh
      - name: Security regression tests registered (D61)
        if: ${{ !cancelled() }}
        run: .github/scripts/check-security-tests.sh
      - name: Tests of the repository checks
        if: ${{ !cancelled() && needs.changes.outputs.checks != 'false' }}
        env:
          REQUIRE_DOCKER: "1"
          REQUIRE_GO: "1"
        run: .github/scripts/test-checks.sh

  # The checks that are not tests: formatting, go.mod, vet, banned settings. They run apart from the
  # test shards, in parallel with them.
  go-checks:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: go (checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, tidy, vet, banned settings
        env:
          GO_CHECKS: only
        run: .github/scripts/check-go.sh

  # The race tests in four parallel shards: internal/controller, the slowest package, split by test
  # name over shards 1 and 2, the other packages over shards 3 and 4. None of the checks named go,
  # go (1/4) ... is a required check.
  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: go (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The build cache and the test results, kept between runs; the nightly run on main fills what
      # pull requests start from. Each run saves its own entry (run_id), and the next run restores
      # the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            go-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-shard${{ matrix.shard }}-
            go-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Race tests of the shard
        env:
          GO_CHECKS: skip
          GO_TEST_SHARD: ${{ matrix.shard }}/4
        run: .github/scripts/check-go.sh

  go-lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        if: ${{ !cancelled() }}
        run: .github/scripts/check-golangci.sh
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: .github/scripts/check-govulncheck.sh

  fuzz:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz smoke runs
        run: .github/scripts/check-fuzz.sh 10s

  proto:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # labels and title for the breaking-change override
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares with origin/main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A merge group's branch is named gh-readonly-queue/<base>/pr-<number>-<sha>, after the last
      # pull request in it; only that one's override counts there.
      - name: Breaking-change override (D56)
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -z $PR && $REF_NAME =~ /pr-([0-9]+)- ]]; then
            PR=${BASH_REMATCH[1]}
          fi
          if [[ -z $PR ]]; then
            echo "no pull request number in '$REF_NAME'"
            exit 0
          fi
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(" ")')
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          if [[ " $labels " == *" breaking "* && $title =~ ^[a-z]+(\([a-z-]+\))?!: ]]; then
            echo "ALLOW_BREAKING=1" >>"$GITHUB_ENV"
          fi
      - name: buf lint, breaking, generated code
        run: .github/scripts/check-buf.sh

  # The database tests in three parallel shards of the packages; shard 1 also lints the migrations.
  store:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: store (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Full runs test on two PostgreSQL versions, one after the other, each package with up to
    # 20 minutes (check-store.sh).
    timeout-minutes: ${{ inputs.full && 60 || 30 }}
    services:
      pg16:
        image: mirror.gcr.io/library/postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: rpmgr
          POSTGRES_PASSWORD: rpmgr # a throw-away test database
        ports: ["5416:5432"]
        options: --health-cmd "pg_isready -U rpmgr" --health-interval 2s --health-timeout 5s --health-retries 30
      pg18:
        image: mirror.gcr.io/library/postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: rpmgr
          POSTGRES_PASSWORD: rpmgr # a throw-away test database
          POSTGRES_DB: lintdev # empty development database for atlas migrate lint
        ports: ["5418:5432"]
        options: --health-cmd "pg_isready -U rpmgr" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The build cache and the test results, kept between runs; the nightly run on main fills what
      # pull requests start from. Each run saves its own entry (run_id), and the next run restores
      # the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            go-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-shard${{ matrix.shard }}-
            go-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Store tests on PostgreSQL 18, and 16 in full runs; migrations linted
        env:
          STORE_SKIP_SQLITE: "1" # the go job runs the same tests on SQLite
          GO_TEST_SHARD: ${{ matrix.shard }}/3
          RPMGR_TEST_PG_URLS: >-
            ${{ inputs.full && 'postgres://rpmgr:rpmgr@127.0.0.1:5416/postgres?sslmode=disable' || '' }}
            postgres://rpmgr:rpmgr@127.0.0.1:5418/postgres?sslmode=disable
          RPMGR_LINT_PG_DEV: postgres://rpmgr:rpmgr@127.0.0.1:5418/lintdev?sslmode=disable
          REQUIRE_PG: "1"
        run: .github/scripts/check-store.sh

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 150 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Container end-to-end tests; in full runs the whole matrix and the chaos tests
        env:
          REQUIRE_DOCKER: "1"
          E2E_FULL: ${{ inputs.full && '1' || '' }}
        run: .github/scripts/check-e2e.sh

  build:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: build (${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: linux
            platforms: linux/amd64 linux/arm64 linux/arm linux/riscv64
          - set: windows and macos
            platforms: windows/amd64 darwin/amd64 darwin/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet (pull requests) or build and vet (full runs) for every platform
        env:
          RPMGR_PLATFORMS: ${{ matrix.platforms }}
          MODE: ${{ inputs.full && 'full' || 'vet' }}
        run: .github/scripts/check-build.sh . "$MODE"

  go-arm64:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04-arm
    # arm64, then armv7. Full runs keep the race detector on arm64: 13 to 20 minutes on the hosted
    # runner. Pull requests and merge groups run without it (check-test-arch.sh).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The build cache and the test results, kept between runs; the nightly run on main fills what
      # pull requests start from. Each run saves its own entry (run_id), and the next run restores
      # the newest one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-go-arm64-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-go-arm64-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-go-arm64-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Tests on arm64; with the race detector in full runs
        if: ${{ !cancelled() }}
        run: .github/scripts/check-test-arch.sh arm64
      - name: Tests on armv7, natively on the same host
        if: ${{ !cancelled() }}
        run: .github/scripts/check-test-arch.sh arm

  ops:
    needs: changes
    if: ${{ needs.changes.outputs.ops == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.full && '0' || '1' }} # the nightly run needs the release tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The role units, verified by systemd-analyze on Debian 13 and Ubuntu 22.04
        if: ${{ !cancelled() }}
        run: .github/scripts/check-units.sh
      - name: The install script on every supported distribution
        if: ${{ !cancelled() }}
        run: .github/scripts/check-install.sh
      - name: The root updater on a real systemd host, with /var on a tmpfs
        if: ${{ !cancelled() }}
        run: .github/scripts/check-ota.sh
      - name: A lone gateway and an all-in-one upgraded under load with the socket hand-off
        if: ${{ !cancelled() }}
        env:
          # A pull request hands the code under review over to itself; the nightly run starts
          # from the last release (D159).
          HANDOFF_FROM: ${{ inputs.full && 'release' || 'HEAD' }}
        run: .github/scripts/check-handoff.sh

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install, audit, lint, type-check, test and build the web UI
        run: .github/scripts/check-web.sh
      - name: Browser tests with axe against an all-in-one
        env:
          REQUIRE_DOCKER: "1"
        run: .github/scripts/check-web-e2e.sh

  docs:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links and anchors
        if: ${{ !cancelled() }}
        run: .github/scripts/check-links.sh
      - name: Mermaid diagrams
        if: ${{ !cancelled() && needs.changes.outputs.md != 'false' }}
        run: .github/scripts/check-mermaid.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: .github/scripts/check-secrets.sh

# Per-PR checks and checks on main (docs/12-testing-and-quality.md, "Continuous integration"):
# repository files, documents, workflows and secrets, the Go, protobuf, store, build and
# end-to-end stages. Every step is a script in .github/scripts/ that runs the same way locally.
# Until v1.0.0 (D64) a pull request runs only the stages its changes need, PostgreSQL 18 only and
# the cross-platform builds as vet only; a push to main runs only the stages that always run; the
# nightly run calls this workflow with full set to run everything.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      full:
        description: Run every stage, on every PostgreSQL and with full builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      checks: ${{ steps.areas.outputs.checks }}
      md: ${{ steps.areas.outputs.md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stages the changes need (D64)
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $FULL == true ]]; then
            args=(--all)
          elif [[ $EVENT == pull_request ]]; then
            args=("$BASE" "$HEAD")
          else
            args=(--none)
          fi
          .github/scripts/changed-areas.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  # lint and docs are required checks: they run even when the changes job fails, and then run
  # every step.
  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: .github/scripts/check-spdx.sh
      - name: Workflows
        if: ${{ !cancelled() }}
        run: .github/scripts/check-workflows.sh
      - name: Security regression tests registered (D61)
        if: ${{ !cancelled() }}
        run: .github/scripts/check-security-tests.sh
      - name: Tests of the repository checks
        if: ${{ !cancelled() && needs.changes.outputs.checks != 'false' }}
        env:
          REQUIRE_DOCKER: "1"
          REQUIRE_GO: "1"
        run: .github/scripts/test-checks.sh

  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, tidy, vet, banned settings, race tests
        run: .github/scripts/check-go.sh

  go-lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        if: ${{ !cancelled() }}
        run: .github/scripts/check-golangci.sh
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: .github/scripts/check-govulncheck.sh

  fuzz:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz smoke runs
        run: .github/scripts/check-fuzz.sh 10s

  proto:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # labels and title for the breaking-change override
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares with origin/main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Breaking-change override (D56)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(" ")')
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          if [[ " $labels " == *" breaking "* && $title =~ ^[a-z]+(\([a-z-]+\))?!: ]]; then
            echo "ALLOW_BREAKING=1" >>"$GITHUB_ENV"
          fi
      - name: buf lint, breaking, generated code
        run: .github/scripts/check-buf.sh

  store:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      pg16:
        image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65
        env:
          POSTGRES_USER: rpmgr
          POSTGRES_PASSWORD: rpmgr # a throw-away test database
        ports: ["5416:5432"]
        options: --health-cmd "pg_isready -U rpmgr" --health-interval 2s --health-timeout 5s --health-retries 30
      pg18:
        image: postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
        env:
          POSTGRES_USER: rpmgr
          POSTGRES_PASSWORD: rpmgr # a throw-away test database
          POSTGRES_DB: lintdev # empty development database for atlas migrate lint
        ports: ["5418:5432"]
        options: --health-cmd "pg_isready -U rpmgr" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Store tests on SQLite and PostgreSQL 18, and 16 in full runs; migrations linted
        env:
          RPMGR_TEST_PG_URLS: >-
            ${{ inputs.full && 'postgres://rpmgr:rpmgr@127.0.0.1:5416/postgres?sslmode=disable' || '' }}
            postgres://rpmgr:rpmgr@127.0.0.1:5418/postgres?sslmode=disable
          RPMGR_LINT_PG_DEV: postgres://rpmgr:rpmgr@127.0.0.1:5418/lintdev?sslmode=disable
          REQUIRE_PG: "1"
        run: .github/scripts/check-store.sh

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Container end-to-end tests
        env:
          REQUIRE_DOCKER: "1"
        run: .github/scripts/check-e2e.sh

  build:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: build (${{ matrix.set }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: linux
            platforms: linux/amd64 linux/arm64 linux/arm linux/riscv64
          - set: windows and macos
            platforms: windows/amd64 darwin/amd64 darwin/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet (pull requests) or build and vet (full runs) for every platform
        env:
          RPMGR_PLATFORMS: ${{ matrix.platforms }}
          MODE: ${{ inputs.full && 'full' || 'vet' }}
        run: .github/scripts/check-build.sh . "$MODE"

  go-arm64:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests on arm64, with the race detector
        if: ${{ !cancelled() }}
        run: .github/scripts/check-test-arch.sh arm64
      - name: Tests on armv7, natively on the same host
        if: ${{ !cancelled() }}
        run: .github/scripts/check-test-arch.sh arm

  docs:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links and anchors
        if: ${{ !cancelled() }}
        run: .github/scripts/check-links.sh
      - name: Mermaid diagrams
        if: ${{ !cancelled() && needs.changes.outputs.md != 'false' }}
        run: .github/scripts/check-mermaid.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: .github/scripts/check-secrets.sh

# Per-PR checks and checks on main (docs/12-testing-and-quality.md, "Continuous integration"):
# repository files, documents, workflows and secrets, and the Go stages; the protobuf, build and
# web stages are added by their Phase 1 slices. Every step is a script in .github/scripts/ that
# runs the same way locally.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: SPDX headers
        if: ${{ !cancelled() }}
        run: .github/scripts/check-spdx.sh
      - name: Workflows
        if: ${{ !cancelled() }}
        run: .github/scripts/check-workflows.sh
      - name: Security regression tests registered (D61)
        if: ${{ !cancelled() }}
        run: .github/scripts/check-security-tests.sh
      - name: Tests of the repository checks
        if: ${{ !cancelled() }}
        env:
          REQUIRE_DOCKER: "1"
          REQUIRE_GO: "1"
        run: .github/scripts/test-checks.sh

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, tidy, vet, banned settings, race tests
        if: ${{ !cancelled() }}
        run: .github/scripts/check-go.sh
      - name: Fuzz smoke runs
        if: ${{ !cancelled() }}
        run: .github/scripts/check-fuzz.sh 10s
      - name: golangci-lint
        if: ${{ !cancelled() }}
        run: .github/scripts/check-golangci.sh
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: .github/scripts/check-govulncheck.sh

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # labels and title for the breaking-change override
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares with origin/main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Breaking-change override (D56)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(" ")')
          title=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          if [[ " $labels " == *" breaking "* && $title =~ ^[a-z]+(\([a-z-]+\))?!: ]]; then
            echo "ALLOW_BREAKING=1" >>"$GITHUB_ENV"
          fi
      - name: buf lint, breaking, generated code
        run: .github/scripts/check-buf.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and vet for every platform
        run: .github/scripts/check-build.sh

  go-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tests on arm64, with the race detector
        if: ${{ !cancelled() }}
        run: .github/scripts/check-test-arch.sh arm64
      - name: Tests on armv7, natively on the same host
        if: ${{ !cancelled() }}
        run: .github/scripts/check-test-arch.sh arm

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links and anchors
        if: ${{ !cancelled() }}
        run: .github/scripts/check-links.sh
      - name: Mermaid diagrams
        if: ${{ !cancelled() }}
        run: .github/scripts/check-mermaid.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: .github/scripts/check-secrets.sh

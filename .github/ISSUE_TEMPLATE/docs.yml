name: Documentation problem
description: Something in the user guide or the documents is wrong, missing or unclear
labels: ["type:docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link to the page or its path in the repository.
      placeholder: "docs/guide/quick-start.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording (optional)

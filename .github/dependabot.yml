# Dependency updates (docs/08-software-stack.md, "Dependency policy"). Go modules, npm and container
# base images are added when the first code that uses them lands. Tool images used by the scripts
# in .github/scripts/ are pinned by digest there and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels:
      - no-changelog
      - type:improvement

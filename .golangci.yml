# golangci-lint configuration (docs/12-testing-and-quality.md, "Security testing"). Run with
# .github/scripts/check-golangci.sh. Bans that forbidigo cannot see in composite literals (TLS and
# QUIC settings) are checked by tools/bannedapi, run from .github/scripts/check-go.sh.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
  settings:
    errcheck:
      # Writing a message to stdout or stderr has no useful error path.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # Keys, tokens and nonces come from crypto/rand only.
        crypto-rand:
          files:
            - "**/internal/authz/**"
            - "**/internal/pki/**"
            - "**/internal/secret/**"
            - "**/internal/token/**"
            - "**/internal/tunnel/**"
          deny:
            - pkg: math/rand
              desc: keys, tokens and nonces use crypto/rand
            - pkg: math/rand/v2
              desc: keys, tokens and nonces use crypto/rand
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^secret\.Value\.Reveal$'
          msg: Reveal is allowed only in the packages listed in .golangci.yml (docs/04)
        - pattern: '^privacy\.DecisionContext$'
          msg: it skips Ent's privacy policies; allowed only in internal/store (docs/06)
        - pattern: '^tls\.Config\.(InsecureSkipVerify|Renegotiation|VerifyPeerCertificate)$'
          msg: banned TLS setting (docs/03); see tools/bannedapi
  exclusions:
    rules:
      # The allow-list for secret.Value.Reveal; every addition is reviewed in this file.
      - path: internal/secret/
        text: Reveal
        linters: [forbidigo]
      # The CA opens its keys to sign with them.
      - path: internal/pki/
        text: Reveal
        linters: [forbidigo]
      # certmagic's storage hands it the account keys and certificates it stored.
      - path: internal/acme/
        text: Reveal
        linters: [forbidigo]
      # Route certificate keys are opened for the gateways that terminate TLS with them.
      - path: internal/certs/
        text: Reveal
        linters: [forbidigo]
      # A user's authenticator seed is opened to check a code.
      - path: internal/accounts/mfa\.go
        text: Reveal
        linters: [forbidigo]
      # The stored response of a request_id is opened to answer a retry.
      - path: internal/api/dedup\.go
        text: Reveal
        linters: [forbidigo]
      - path: internal/store/
        text: DecisionContext
        linters: [forbidigo]
      # Tests start subprocesses, write fixtures with ordinary modes and read the files they wrote.
      - path: _test\.go$
        text: "G(204|301|304|306)"
        linters: [gosec]

run:
  timeout: 10m
  # Lint the test-only code of the rpmgrtest build too (D60); a release build is the same code
  # without those files.
  build-tags:
    - rpmgrtest
    - e2e # the container end-to-end harness in test/e2e
    - realclients # the nightly real-client run against the gateway

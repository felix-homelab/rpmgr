syntax = "proto3";

package rpmgr.agent.v1;

import "google/protobuf/timestamp.proto";
import "rpmgr/v1/options.proto";
import "rpmgr/v1/policy.proto";

option go_package = "github.com/felix-homelab/rpmgr/gen/rpmgr/agent/v1;agentv1";

// Revision identifies a configuration state: seq orders revisions within one database epoch, and a
// restore starts a new epoch (docs/03-connections.md, "Revisions and ordering").
message Revision {
  // The database epoch, a UUIDv7.
  string db_epoch = 1;
  // The revision within the epoch.
  uint64 seq = 2;
}

// Signed carries a signed message as the exact bytes that were signed, so agents verify and
// persist those bytes and nothing is re-encoded (R14). The signer is the controller's
// config-signing key, whose certificate chains to the pinned root (docs/04-security.md, "CA
// hierarchy").
message Signed {
  // The serialized message: a Snapshot or a DenyList.
  bytes payload = 1;
  // ECDSA P-256 with SHA-256 over payload, ASN.1 encoded.
  bytes signature = 2;
  // The signer: the lower-case hexadecimal SHA-256 of its certificate's SubjectPublicKeyInfo.
  string key_id = 3;
}

// Snapshot is everything one agent runs at one revision (docs/03-connections.md, "Configuration
// reconciliation"). Its hash is the SHA-256 of the signed payload.
message Snapshot {
  // The revision it was compiled from.
  Revision revision = 1;
  // The SPIFFE ID of the agent it was compiled for; an agent refuses a snapshot for another.
  string agent = 2;
  // The controller endpoints, in the order the agent tries them.
  repeated string controller_endpoints = 3;
  // The resources, each with its content hash, so unchanged resources stay untouched.
  repeated Resource resources = 4;
  // The key_id of the key that signs it: a new signing key changes the snapshot's hash, so every
  // agent receives and keeps a copy signed by the new key.
  string signing_key_id = 5;
}

// Resource is one item of a snapshot. The kinds are added by the slices that implement them.
message Resource {
  // The resource's ID, with its type prefix (docs/06-data-model.md, "Identifiers").
  string id = 1;
  // SHA-256 of the resource's content.
  bytes hash = 2;
  // The content.
  oneof kind {
    // Gateways: a tcp route's public port.
    GatewayTCPRoute gateway_tcp_route = 3;
    // Connectors: where a route's streams go.
    ConnectorRoute connector_route = 4;
    // Connectors: a gateway to keep data sessions to.
    ConnectorGateway connector_gateway = 5;
    // Gateways: a tls_passthrough route's hostnames.
    GatewayPassthroughRoute gateway_passthrough_route = 6;
    // Gateways: a udp route's public port.
    GatewayUDPRoute gateway_udp_route = 7;
    // Gateways: a certificate for http route hostnames, fetched by hash.
    GatewayCertificate gateway_certificate = 8;
    // Gateways: an http route's hostnames and how to reach its upstream.
    GatewayHTTPRoute gateway_http_route = 9;
    // Gateways: the HTTP token of a pending domain claim of the gateway's org.
    GatewayDomainChallenge gateway_domain_challenge = 10;
    // A large item the agent fetches by hash with Control.FetchResource.
    ResourceReference reference = 15;
  }
}

// GatewayDomainChallenge is the HTTP proof of a pending domain claim (R17): the gateway answers
// GET http://<fqdn>/.well-known/rpmgr-challenge/<resource ID> with value on port 80. The resource
// ID is the claim's ID.
message GatewayDomainChallenge {
  // The claimed name, lower case without a trailing dot.
  string fqdn = 1;
  // The challenge value.
  string value = 2;
}

// GatewayTCPRoute is a tcp route as a gateway runs it; the resource ID is the route's ID.
message GatewayTCPRoute {
  // The public port.
  uint32 port = 1;
  // A connection without traffic for this long is closed; 0 never.
  uint32 idle_timeout_seconds = 2;
  // The connectors that serve the route, sorted: the gateway opens its streams only to them.
  repeated string connectors = 3;
  // Who may connect.
  RouteAccess access = 4;
}

// RouteAccess is who may use a route: the IP rules of its access policies, in order. The first
// rule that matches the client's address decides; if none does, the client is allowed only when
// no rule allows. No rules allow everyone.
message RouteAccess {
  // The rules, in the order of the route's policies and of each policy's rules.
  repeated IPRule ip_rules = 1;
  // http routes: a client the IP rules allow must also pass each of these, in order.
  repeated BasicAuthRule basic_auth = 2;
}

// BasicAuthRule is a basic_auth rule of an access policy as gateways check it.
message BasicAuthRule {
  // The policy the rule belongs to; cached verifications never cross policies.
  string policy_id = 1;
  // Changes whenever the rule's users or hashes change, so cached verifications end with it.
  string credential_version = 2;
  // The users, each with the argon2id hash of its password in PHC string format.
  repeated rpmgr.v1.BasicAuthUser users = 3;
}

// IPRule allows or denies the clients of some addresses.
message IPRule {
  // Whether a match allows; otherwise it denies.
  bool allow = 1;
  // CIDRs; an IPv4-mapped IPv6 client matches the IPv4 ones.
  repeated string cidrs = 2;
}

// GatewayUDPRoute is a udp route as a gateway serves it.
message GatewayUDPRoute {
  // The public port.
  uint32 port = 1;
  // A flow without datagrams for this long ends.
  uint32 flow_idle_timeout_seconds = 2;
  // The connectors that serve the route, sorted.
  repeated string connectors = 3;
  // Who may send.
  RouteAccess access = 4;
}

// GatewayHTTPRoute is an http route as a gateway serves it on port 443: a request whose host and
// path match one of its hosts goes over a tunnel stream to one of the connectors, and on to the
// upstream with the upstream protocol.
message GatewayHTTPRoute {
  // The hostnames, each with its path prefix, sorted.
  repeated HTTPHost hosts = 1;
  // How the gateway speaks to the upstream: "http" (HTTP/1.1), "h2c", or "https" (TLS, then
  // HTTP/2 or HTTP/1.1 as ALPN decides).
  string upstream_protocol = 2;
  // The connectors that serve the route, sorted.
  repeated string connectors = 3;
  // Whether WebSocket and other upgrades pass through.
  bool websocket = 4;
  // For "https": how to verify each enabled target, sorted by target ID.
  repeated UpstreamTLS upstream_tls = 5;
  // The Host header sent upstream; empty keeps the client's.
  string host_header = 6;
  // Request headers set before the request goes upstream, sorted by name; an empty value removes
  // the header.
  repeated HTTPHeader request_headers = 7;
  // Response headers set before the response goes to the client, sorted by name; an empty value
  // removes the header.
  repeated HTTPHeader response_headers = 8;
  // The largest request body; 0 sets no limit.
  uint64 max_body_bytes = 9;
  // The gateway group's trusted proxies: the CIDRs whose forwarding headers the gateway keeps.
  repeated string trusted_proxies = 10;
  // What plain HTTP on port 80 does: "redirect" to HTTPS, "serve" the route, or "off".
  string port80 = 11;
  // The max-age of Strict-Transport-Security sent over HTTPS; 0 sends none.
  uint32 hsts_max_age_seconds = 12;
  // Who may send requests.
  RouteAccess access = 13;
}

// HTTPHeader is a header name with its value.
message HTTPHeader {
  // The canonical header name.
  string name = 1;
  // The value; empty removes the header.
  string value = 2;
}

// UpstreamTLS is how the gateway verifies the HTTPS upstream of one route target.
message UpstreamTLS {
  // The route target.
  string target_id = 1;
  // The name the upstream's certificate must carry.
  string server_name = 2;
  // PEM CA certificates to verify it with; empty is the gateway host's trust store.
  bytes ca_pem = 3;
  // If set, the SHA-256 of the leaf's SubjectPublicKeyInfo must equal it.
  bytes spki_sha256 = 4;
}

// HTTPHost is one hostname of an http route with its path prefix; "" is every path.
message HTTPHost {
  // The hostname, or "*.name" for every name one label below.
  string hostname = 1;
  // The path prefix, starting with "/".
  string path_prefix = 2;
}

// GatewayCertificate is a public certificate a gateway terminates TLS with, for the http route
// hostnames it lists: names of routes of the certificate's own org that it covers. The chain and
// key come with Control.FetchResource, as a CertificateItem whose SHA-256 is content_sha256.
message GatewayCertificate {
  // SHA-256 of the CertificateItem.
  bytes content_sha256 = 1;
  // The route hostnames it serves, sorted.
  repeated string hostnames = 2;
  // The leaf's expiry; among certificates for a name, the gateway prefers the latest.
  google.protobuf.Timestamp not_after = 3;
}

// CertificateItem is a certificate chain with its key, the content of a GatewayCertificate.
message CertificateItem {
  // The DER certificates, leaf first.
  repeated bytes chain = 1;
  // The leaf's private key, PKCS #8 DER.
  bytes private_key = 2 [(rpmgr.v1.sensitive) = true];
}

// GatewayPassthroughRoute is a tls_passthrough route as a gateway serves it on port 443: a TLS
// connection whose SNI is one of the hostnames goes, still encrypted, to one of the connectors.
message GatewayPassthroughRoute {
  // The hostnames, sorted; one may start with "*." for every name one label below.
  repeated string hostnames = 1;
  // The connectors that serve the route, sorted.
  repeated string connectors = 2;
  // Who may connect.
  RouteAccess access = 3;
}

// TransportPolicy is how a route chooses its data-session transport (docs/03-connections.md,
// "Transport selection").
enum TransportPolicy {
  // Not set.
  TRANSPORT_POLICY_UNSPECIFIED = 0;
  // QUIC first, TLS + reverse HTTP/2 when UDP is blocked or QUIC loses the race.
  TRANSPORT_POLICY_AUTO = 1;
  // QUIC only; never falls back.
  TRANSPORT_POLICY_QUIC = 2;
  // TLS + reverse HTTP/2 only; never falls back.
  TRANSPORT_POLICY_H2 = 3;
}

// ConnectorRoute is a route as a connector serves it; the resource ID is the route's ID.
message ConnectorRoute {
  // The route's type: "tcp", "udp" or "tls_passthrough" in this version.
  string type = 1;
  // Where the connector delivers the route's streams, by priority, then ID.
  repeated Target targets = 2;
  // The effective transport policy: the route's, else the connector's, else the instance default.
  TransportPolicy transport = 3;
}

// ConnectorGateway is a gateway that a connector keeps data sessions to (docs/03-connections.md,
// "Establishment"); the resource ID is the gateway's ID, which the connector expects in the
// gateway's certificate.
message ConnectorGateway {
  // The gateway's own tunnel endpoints, host:port, in the order configured.
  repeated string tunnel_endpoints = 1;
  // The effective transports of the connector's routes on the gateway, sorted: the sessions to keep.
  repeated TransportPolicy transports = 2;
  // The connector's routes on the gateway, sorted.
  repeated string routes = 3;
}

// Target is one destination of a route on the connector's host.
message Target {
  // The target's ID.
  string id = 1;
  // An address and port, or a unix socket path.
  string host = 2;
  // The port of host.
  uint32 port = 3;
  // A unix socket instead of host and port.
  string unix_path = 4;
  // The PROXY protocol version to send: "none", "v1" or "v2".
  string proxy_protocol = 5;
  // Relative share among targets of the same priority.
  uint32 weight = 6;
  // Lower first; higher priorities are failovers.
  uint32 priority = 7;
}

// ResourceReference points to content fetched with Control.FetchResource.
message ResourceReference {
  // Its size in bytes.
  uint64 size = 1;
}

// DenyList is the set of revoked certificates and identities (docs/04-security.md, "Revocation").
// Agents merge it by union and drop an entry only after its not_after.
message DenyList {
  // The epoch and number of this version.
  Revision version = 1;
  // Whether entries is the full set; otherwise it is a delta, sent only above 1 MiB.
  bool full = 2;
  // The entries.
  repeated DenyEntry entries = 3;
}

// DenyEntry is one revoked certificate or identity.
message DenyEntry {
  // What is revoked.
  oneof subject {
    // A serial number, lower-case hexadecimal.
    string serial = 1;
    // A SPIFFE ID.
    string identity = 2;
  }
  // When the covered certificates expire; the entry is dropped after it.
  google.protobuf.Timestamp not_after = 3;
}

syntax = "proto3";

// Package rpmgr.tunnel.v1 is the protocol of data sessions between connectors and gateways
// (docs/03-connections.md, "Data session"): the messages of the session control stream, and the
// preamble of every user, relay and diagnostic stream. Every message is varint(length) ‖ protobuf,
// at most 16 KiB.
package rpmgr.tunnel.v1;

import "google/protobuf/timestamp.proto";
import "rpmgr/agent/v1/control.proto";
import "rpmgr/agent/v1/snapshot.proto";

option go_package = "github.com/felix-homelab/rpmgr/gen/rpmgr/tunnel/v1;tunnelv1";

// StreamKind is what a stream carries.
enum StreamKind {
  // Not a valid kind: answered with RESULT_CODE_PROTOCOL.
  STREAM_KIND_UNSPECIFIED = 0;
  // A public TCP connection, or an HTTP request, to a route. Opened by the gateway.
  STREAM_KIND_TCP = 1;
  // One UDP flow of a route. Opened by the gateway.
  STREAM_KIND_UDP_FLOW = 2;
  // A visitor's connection to a private service, from the visitor's connector (Phase 2).
  STREAM_KIND_RELAY_OUT = 3;
  // The same connection towards the service's connector (Phase 2).
  STREAM_KIND_RELAY_IN = 4;
  // The connector's control session to the controller, through the gateway (ADR-0006).
  STREAM_KIND_CONTROL_PASSTHROUGH = 5;
  // A diagnostic stream.
  STREAM_KIND_DIAG = 6;
}

// ResultCode is the outcome of opening a stream (docs/03-connections.md, "Framing"). The numbers
// are those of 03, so NO_ERROR is the zero value.
enum ResultCode {
  // The stream is open; relay bytes.
  RESULT_CODE_NO_ERROR = 0;
  // The route is not in the connector's active or draining snapshot.
  RESULT_CODE_ROUTE_UNKNOWN = 1;
  // The opener may not open this stream.
  RESULT_CODE_UNAUTHORIZED = 2;
  // The target refused the connection.
  RESULT_CODE_UPSTREAM_REFUSED = 3;
  // The target did not answer within the open timeout.
  RESULT_CODE_UPSTREAM_TIMEOUT = 4;
  // The target reset the connection.
  RESULT_CODE_UPSTREAM_RESET = 5;
  // The session drains; open the stream on another session.
  RESULT_CODE_DRAINING = 6;
  // The receiver is overloaded; open the stream on another session.
  RESULT_CODE_OVERLOADED = 7;
  // The stream broke the protocol.
  RESULT_CODE_PROTOCOL = 8;
  // An internal error of the receiver.
  RESULT_CODE_INTERNAL = 9;
}

// StreamOpen is the first message on every stream, written by the side that opens it.
message StreamOpen {
  // What the stream carries.
  StreamKind kind = 1;
  // The route, or private service, the stream belongs to.
  string route_id = 2;
  // The revision the gateway routed with; the connector also accepts routes still draining.
  rpmgr.agent.v1.Revision snapshot_rev = 3;
  // The original client's address, 4 or 16 bytes.
  bytes src_ip = 4;
  // The original client's port.
  uint32 src_port = 5;
  // The listener's address, 4 or 16 bytes.
  bytes dst_ip = 6;
  // The listener's port.
  uint32 dst_port = 7;
  // From the client's TLS ClientHello, if any.
  string sni = 8;
  // From the client's TLS ClientHello, if any.
  string alpn = 9;
  // W3C trace context: 16 bytes.
  bytes trace_id = 10;
  // W3C trace context: 8 bytes.
  bytes span_id = 11;
  // How long the connector may take to connect to the target.
  uint32 open_timeout_ms = 12;
  // Relay: the visitor's SPIFFE ID. HTTP: the authenticated principal, if any.
  string peer_identity = 13;
  // TCP transport only: answers the connector's OpenRequest with this ID.
  uint64 open_id = 14;
  // Set only with open_id: the outcome of the requested open. The connector then writes no
  // StreamResult.
  StreamResult result = 15;
}

// StreamResult is the first message in the return direction, written by the side that received
// StreamOpen; raw bytes follow.
message StreamResult {
  // The outcome.
  ResultCode code = 1;
  // With NO_ERROR: the route target the connector connected to, so the gateway can verify an
  // HTTPS upstream with that target's TLS settings.
  string target_id = 2;
}

// SessionMessage is a message on the session control stream (docs/03-connections.md,
// "Establishment").
message SessionMessage {
  // The message.
  oneof msg {
    // The connector's first message.
    SessionHello hello = 1;
    // The gateway's answer to SessionHello.
    SessionWelcome welcome = 2;
    // The connector's liveness and RTT probe.
    Ping ping = 3;
    // The answer to Ping.
    Pong pong = 4;
    // The gateway asks the connector to move its streams before the deadline.
    Drain drain = 5;
    // A route's readiness on the connector.
    RouteHealth route_health = 6;
    // TCP transport only: the connector asks the gateway to open a stream.
    OpenRequest open_request = 7;
    // TCP transport only: the gateway refuses an OpenRequest.
    OpenRejected open_rejected = 8;
    // The session ends.
    Goodbye goodbye = 9;
  }
  reserved 10; // P2PCandidates (Phase 3)
}

// SessionHello opens a data session.
message SessionHello {
  // The minor version of the tunnel protocol.
  uint32 proto_minor = 1;
  // The connector's version.
  string agent_version = 2;
  // The connector's capability strings (docs/03-connections.md, "Versioning and capabilities").
  repeated string capabilities = 3;
  // A random ID that is new at every start of the connector process.
  string boot_id = 4;
  // The routes that are ready on the connector.
  repeated string ready_routes = 5;
}

// SessionWelcome answers SessionHello.
message SessionWelcome {
  // The gateway's ID.
  string gateway_id = 1;
  // The minor version of the tunnel protocol the gateway speaks.
  uint32 proto_minor = 2;
  // The gateway's capability strings.
  repeated string capabilities = 3;
  // The connector's address as the gateway sees it, host:port.
  string observed_addr = 4;
}

// Ping measures the round-trip time; it is padded to at least 64 bytes, so that a restarted
// gateway answers it with a stateless reset.
message Ping {
  // Echoed by Pong.
  uint64 seq = 1;
  // Ignored.
  bytes padding = 2;
}

// Pong answers Ping.
message Pong {
  // The Ping's seq.
  uint64 seq = 1;
}

// Drain asks the connector to open no new streams on this session and to move to another one
// before the deadline.
message Drain {
  // Why, for logs.
  string reason = 1;
  // When the gateway closes the session.
  google.protobuf.Timestamp deadline = 2;
}

// RouteHealth reports a route's readiness on the connector.
message RouteHealth {
  // The route.
  string route_id = 1;
  // Whether the gateway may open streams for it.
  bool ready = 2;
  // Why not, when not ready.
  rpmgr.agent.v1.NotReadyReason reason = 3;
  // Details for the operator, for example the target a local policy blocks.
  string detail = 4;
}

// OpenRequest asks the gateway to open a stream on the TCP transport, where the connector cannot.
message OpenRequest {
  // Unique per session; the stream or OpenRejected names it.
  uint64 open_id = 1;
  // What the stream will carry.
  StreamKind kind = 2;
  // The route or private service.
  string route_id = 3;
  // The connector's first bytes, at most 16 KiB with the rest of the message, which the gateway
  // forwards at once.
  bytes first_chunk = 4;
}

// OpenRejected refuses an OpenRequest.
message OpenRejected {
  // The request's open_id.
  uint64 open_id = 1;
  // Why.
  ResultCode code = 2;
}

// GoodbyeCode is why a data session ends.
enum GoodbyeCode {
  // Not given.
  GOODBYE_CODE_UNSPECIFIED = 0;
  // The sender shuts down.
  GOODBYE_CODE_SHUTDOWN = 1;
  // The peer broke the protocol.
  GOODBYE_CODE_PROTOCOL = 2;
  // The peer's identity was revoked or is not assigned to this gateway.
  GOODBYE_CODE_UNAUTHORIZED = 3;
}

// Goodbye ends a data session.
message Goodbye {
  // Why.
  GoodbyeCode code = 1;
}

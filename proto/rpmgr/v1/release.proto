syntax = "proto3";

package rpmgr.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "rpmgr/v1/options.proto";
import "rpmgr/v1/settings.proto";

option go_package = "github.com/felix-homelab/rpmgr/gen/rpmgr/v1;rpmgrv1";

// ReleaseService is the releases the controller knows and the rollouts of one of them to the
// connectors and gateways, staged (D121) or easy (D129) (docs/07-api.md, "Services";
// docs/04-security.md, "Over-the-air updates"), all for the Instance Admin. A rollout only records what the Instance Admin
// decides; the controller's rollout job offers the release and follows the agents.
service ReleaseService {
  // ListReleases pages through the releases, the newest version first.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {permission: "instance.admin"};
  }
  // CheckReleases asks the controller's release check to run now rather than at its next daily
  // check, and returns its state; the releases it finds appear in ListReleases once it ends. While
  // a check runs it joins it. It is refused while the release check is off or the build checks for
  // no releases, and for a while after the last check started or the release source limited the
  // rate (docs/03-connections.md, "Timeouts, keepalive and backoff").
  rpc CheckReleases(CheckReleasesRequest) returns (CheckReleasesResponse) {
    option (rpmgr.v1.authz) = {permission: "instance.admin"};
  }
  // UploadRelease records a release from its signed manifest, signing-key statement and their
  // signatures, verified like the release check, for air-gapped installations and signed
  // downgrades. Its artifacts come from the release source or `rpmgr release import`.
  rpc UploadRelease(UploadReleaseRequest) returns (UploadReleaseResponse) {
    option (rpmgr.v1.authz) = {
      permission: "instance.admin"
      step_up: true
    };
  }
  // CreateRollout starts a rollout of a release: a staged one with its canary agents, or an easy
  // one with its queue of agents. It is refused for a release newer than the controller and while
  // another rollout runs or is paused. A release the mirror does not hold yet is mirrored now, and
  // offered once the mirror holds it (D125).
  rpc CreateRollout(CreateRolloutRequest) returns (CreateRolloutResponse) {
    option (rpmgr.v1.authz) = {
      permission: "instance.admin"
      step_up: true
    };
  }
  // UpgradeAgents adds connectors or gateways to the end of the queue of the easy rollout of the
  // controller's own version that runs or is paused, or starts one with them when no rollout does
  // (D129). It is refused while a staged rollout or a rollout of another release runs or is paused.
  rpc UpgradeAgents(UpgradeAgentsRequest) returns (UpgradeAgentsResponse) {
    option (rpmgr.v1.authz) = {
      permission: "instance.admin"
      step_up: true
    };
  }
  // GetRollout returns a rollout with how many of its agents are in each state.
  rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {permission: "instance.admin"};
  }
  // ListRollouts pages through the rollouts, the newest first.
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {permission: "instance.admin"};
  }
  // ListRolloutTargets pages through a rollout's agents, each with its state and reason.
  rpc ListRolloutTargets(ListRolloutTargetsRequest) returns (ListRolloutTargetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {permission: "instance.admin"};
  }
  // AdvanceRollout moves a running staged rollout to a higher percentage or to all agents.
  rpc AdvanceRollout(AdvanceRolloutRequest) returns (AdvanceRolloutResponse) {
    option (rpmgr.v1.authz) = {
      permission: "instance.admin"
      step_up: true
    };
  }
  // PauseRollout pauses a running rollout: agents offered the release keep it, no further agent
  // is offered it.
  rpc PauseRollout(PauseRolloutRequest) returns (PauseRolloutResponse) {
    option (rpmgr.v1.authz) = {permission: "instance.admin"};
  }
  // ResumeRollout lets a paused rollout run again.
  rpc ResumeRollout(ResumeRolloutRequest) returns (ResumeRolloutResponse) {
    option (rpmgr.v1.authz) = {
      permission: "instance.admin"
      step_up: true
    };
  }
  // CancelRollout ends a running or paused rollout for good; agents that updated keep the
  // release.
  rpc CancelRollout(CancelRolloutRequest) returns (CancelRolloutResponse) {
    option (rpmgr.v1.authz) = {
      permission: "instance.admin"
      step_up: true
    };
  }
}

// ReleaseSource is where the controller got a release's manifest.
enum ReleaseSource {
  // Not set.
  RELEASE_SOURCE_UNSPECIFIED = 0;
  // The daily release check.
  RELEASE_SOURCE_CHECK = 1;
  // An Instance Admin's upload.
  RELEASE_SOURCE_UPLOAD = 2;
  // `rpmgr release import` on the controller host.
  RELEASE_SOURCE_IMPORT = 3;
}

// ReleaseCheckOutcome is how the controller's last release check ended.
enum ReleaseCheckOutcome {
  // No check has ended since the controller started.
  RELEASE_CHECK_OUTCOME_UNSPECIFIED = 0;
  // The check listed the releases and the mirror holds what it keeps.
  RELEASE_CHECK_OUTCOME_OK = 1;
  // The check failed; the mirror keeps what it had.
  RELEASE_CHECK_OUTCOME_FAILED = 2;
  // The release check is off: the mirror only kept the targets of rollouts.
  RELEASE_CHECK_OUTCOME_OFF = 3;
  // The build checks for no releases: a development build, or one without release root keys.
  RELEASE_CHECK_OUTCOME_NONE = 4;
}

// ReleaseCheck is the state of the controller's release check; output only. Each controller
// checks for its own mirror, so it is the state of the controller that answers.
message ReleaseCheck {
  // Whether a check runs now, or was asked for and starts at once.
  bool running = 1;
  // When the last check ended; not set before the first ends.
  google.protobuf.Timestamp check_time = 2;
  // How it ended.
  ReleaseCheckOutcome outcome = 3;
  // The error of a failed check.
  string error = 4;
}

// Release is a release whose signed manifest the controller verified; output only.
message Release {
  // The release's ID.
  string id = 1;
  // Its version, e.g. "1.5.0".
  string version = 2;
  // The channel its manifest is signed for.
  UpdateChannel channel = 3;
  // Its manifest's sequence number.
  int64 manifest_seq = 4;
  // Where the controller got it.
  ReleaseSource source = 5;
  // Whether the mirror holds all its artifacts under /dl/.
  bool mirrored = 6;
  // When the mirror last held it complete; not set while it does not.
  google.protobuf.Timestamp mirror_time = 7;
  // When the controller recorded it.
  google.protobuf.Timestamp create_time = 8;
  // Whether it is the version the controller runs.
  bool controller_version = 9;
  // Whether it is newer than the controller, so that no rollout may install it.
  bool newer_than_controller = 10;
}

// RolloutStage is how far a rollout reaches.
enum RolloutStage {
  // Not set.
  ROLLOUT_STAGE_UNSPECIFIED = 0;
  // The canary agents chosen at its creation.
  ROLLOUT_STAGE_CANARY = 1;
  // The agents whose bucket is below the rollout's percentage, and the canary agents.
  ROLLOUT_STAGE_PERCENTAGE = 2;
  // Every agent.
  ROLLOUT_STAGE_ALL = 3;
}

// RolloutState is where a rollout stands.
enum RolloutState {
  // Not set.
  ROLLOUT_STATE_UNSPECIFIED = 0;
  // The controller offers the release to the agents of the current stage.
  ROLLOUT_STATE_RUNNING = 1;
  // Waiting for the Instance Admin, after a rollback, a stalled agent or a pause.
  ROLLOUT_STATE_PAUSED = 2;
  // Every agent of the stage "all" updated or was skipped.
  ROLLOUT_STATE_COMPLETED = 3;
  // Ended by the Instance Admin.
  ROLLOUT_STATE_CANCELLED = 4;
}

// RolloutTargetState is where one agent of a rollout stands.
enum RolloutTargetState {
  // Not set.
  ROLLOUT_TARGET_STATE_UNSPECIFIED = 0;
  // Not offered the release yet.
  ROLLOUT_TARGET_STATE_PENDING = 1;
  // Offered the release in its snapshot.
  ROLLOUT_TARGET_STATE_OFFERED = 2;
  // Staged the release for its updater.
  ROLLOUT_TARGET_STATE_STAGED = 3;
  // Runs the release.
  ROLLOUT_TARGET_STATE_UPDATED = 4;
  // Its updater rolled back.
  ROLLOUT_TARGET_STATE_ROLLED_BACK = 5;
  // Its updater refused the release.
  ROLLOUT_TARGET_STATE_REFUSED = 6;
  // Left out: offline, decommissioned, on auto_update notify or off, or on a channel that refuses
  // the release.
  ROLLOUT_TARGET_STATE_SKIPPED = 7;
  // Reported neither the release nor a failure in time.
  ROLLOUT_TARGET_STATE_STALLED = 8;
}

// AgentKind is the kind of an agent.
enum AgentKind {
  // Not set.
  AGENT_KIND_UNSPECIFIED = 0;
  // A connector.
  AGENT_KIND_CONNECTOR = 1;
  // A gateway.
  AGENT_KIND_GATEWAY = 2;
}

// RolloutCounts are how many agents of a rollout are in each state.
message RolloutCounts {
  // Not offered the release yet.
  int32 pending = 1;
  // Offered it.
  int32 offered = 2;
  // Staged it.
  int32 staged = 3;
  // Run it.
  int32 updated = 4;
  // Rolled back.
  int32 rolled_back = 5;
  // Refused it.
  int32 refused = 6;
  // Skipped.
  int32 skipped = 7;
  // Stalled.
  int32 stalled = 8;
}

// Rollout is a rollout of one release, staged or easy; output only.
message Rollout {
  // The rollout's ID.
  string id = 1;
  // The release it installs.
  string release_id = 2;
  // The release's version.
  string version = 3;
  // How far it reaches.
  RolloutStage stage = 4;
  // The share of agents the stage covers: 0 for the canary stage, 100 for all.
  int32 percentage = 5;
  // Where it stands.
  RolloutState state = 6;
  // Why it is paused: the agent and its reason, or that an Instance Admin paused it.
  string pause_reason = 7;
  // How many of its agents are in each state.
  RolloutCounts counts = 8;
  // The user who created it.
  string create_user_id = 9;
  // When it was created.
  google.protobuf.Timestamp create_time = 10;
  // The user who changed it last; empty when only the rollout job did.
  string update_user_id = 11;
  // When it changed last.
  google.protobuf.Timestamp update_time = 12;
  // The etag of the rollout's current state.
  string etag = 13;
  // Its kind: ADVANCED for a staged rollout, EASY for a queue of agents; an easy rollout's stage
  // and percentage stay at CANARY and 0.
  RolloutMode mode = 14;
}

// RolloutTarget is one agent of a rollout; output only.
message RolloutTarget {
  // The target's ID.
  string id = 1;
  // The rollout.
  string rollout_id = 2;
  // The agent's ID: a connector's or a gateway's.
  string agent_id = 3;
  // The agent's kind.
  AgentKind agent_kind = 4;
  // The agent's name; empty once its row is gone.
  string agent_name = 5;
  // The agent's org.
  string org_id = 6;
  // Whether it is a canary agent.
  bool canary = 7;
  // Its place in the percentages, 0 to 99: a stage of p % takes the agents below p.
  int32 bucket = 8;
  // Where it stands.
  RolloutTargetState state = 9;
  // Why it is skipped, refused, rolled back or stalled.
  string reason = 10;
  // The version it ran when the rollout was created; empty if it never connected.
  string version_before = 11;
  // When its state changed last.
  google.protobuf.Timestamp update_time = 12;
  // Its place in an easy rollout's queue, from 1; 0 in a staged rollout.
  int32 position = 13;
}

// ListReleasesRequest pages through the releases.
message ListReleasesRequest {
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 1;
  // The page after the one that returned it.
  string page_token = 2;
}

// ListReleasesResponse is one page of releases.
message ListReleasesResponse {
  // The releases.
  repeated Release releases = 1;
  // The token of the next page; empty after the last.
  string next_page_token = 2;
  // The version the controller runs.
  string controller_version = 3;
  // The state of the release check.
  ReleaseCheck release_check = 4;
}

// CheckReleasesRequest asks for a release check now.
message CheckReleasesRequest {}

// CheckReleasesResponse is the state of the release check, running unless the build checks for
// no releases.
message CheckReleasesResponse {
  // The state of the release check.
  ReleaseCheck release_check = 1;
}

// UploadReleaseRequest is a release's signed files, as a GitHub release has them.
message UploadReleaseRequest {
  // signing-key.json: a root key's statement for the signing key.
  bytes signing_key_statement = 1 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 65536
  }];
  // signing-key.json.minisig.
  bytes statement_signature = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 4096
  }];
  // manifest.json.
  bytes manifest = 3 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 1048576
  }];
  // manifest.json.minisig.
  bytes manifest_signature = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 4096
  }];
}

// UploadReleaseResponse is the recorded release.
message UploadReleaseResponse {
  // The release: the uploaded manifest, or the recorded one if its seq is not lower.
  Release release = 1;
}

// CreateRolloutRequest is a new rollout.
message CreateRolloutRequest {
  // The release to install.
  string release_id = 1 [(buf.validate.field).string.min_len = 1];
  // A staged rollout's canary agents, connectors or gateways of any org, by ID; at least one.
  // Empty in an easy rollout.
  repeated string canary_agent_ids = 2 [(buf.validate.field).repeated = {
    max_items: 50
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  // The kind of rollout; not set is ADVANCED, a staged rollout.
  RolloutMode mode = 3 [(buf.validate.field).enum.defined_only = true];
  // An easy rollout's queue, connectors or gateways of any org, by ID, in the order they update;
  // at least one. Empty in a staged rollout.
  repeated string agent_ids = 4 [(buf.validate.field).repeated = {
    max_items: 1000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

// CreateRolloutResponse is the new rollout.
message CreateRolloutResponse {
  // The rollout, at its canary stage or with its queue.
  Rollout rollout = 1;
}

// UpgradeAgentsRequest names the agents to update to the controller's own version.
message UpgradeAgentsRequest {
  // Connectors or gateways of any org, by ID, in the order they join the queue.
  repeated string agent_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

// UpgradeAgentsResponse is the easy rollout the agents are queued in.
message UpgradeAgentsResponse {
  // The rollout: the one that ran, or the one the request started.
  Rollout rollout = 1;
  // The agents' targets in the order of the request, each with its place in the queue; an agent
  // queued before keeps its place.
  repeated RolloutTarget rollout_targets = 2;
}

// GetRolloutRequest names a rollout.
message GetRolloutRequest {
  // The rollout's ID.
  string rollout_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetRolloutResponse is a rollout.
message GetRolloutResponse {
  // The rollout.
  Rollout rollout = 1;
}

// ListRolloutsRequest pages through the rollouts.
message ListRolloutsRequest {
  // Only the one that runs or is paused.
  bool active_only = 1;
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 2;
  // The page after the one that returned it.
  string page_token = 3;
}

// ListRolloutsResponse is one page of rollouts.
message ListRolloutsResponse {
  // The rollouts.
  repeated Rollout rollouts = 1;
  // The token of the next page; empty after the last.
  string next_page_token = 2;
}

// ListRolloutTargetsRequest pages through a rollout's agents.
message ListRolloutTargetsRequest {
  // The rollout's ID.
  string rollout_id = 1 [(buf.validate.field).string.min_len = 1];
  // Only agents in these states, if any are given.
  repeated RolloutTargetState states = 2 [(buf.validate.field).repeated = {
    max_items: 8
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 3;
  // The page after the one that returned it.
  string page_token = 4;
}

// ListRolloutTargetsResponse is one page of a rollout's agents.
message ListRolloutTargetsResponse {
  // The agents, in the order of their IDs.
  repeated RolloutTarget rollout_targets = 1;
  // The token of the next page; empty after the last.
  string next_page_token = 2;
}

// AdvanceRolloutRequest names a running rollout and its next stage.
message AdvanceRolloutRequest {
  // The rollout's ID.
  string rollout_id = 1 [(buf.validate.field).string.min_len = 1];
  // The next stage: a percentage above the current one, or all agents.
  oneof next {
    option (buf.validate.oneof).required = true;
    // The share of agents, 1 to 99.
    int32 percentage = 2 [(buf.validate.field).int32 = {
      gte: 1
      lte: 99
    }];
    // Every agent; must be true.
    bool all = 3 [(buf.validate.field).bool.const = true];
  }
  // The etag the caller read; empty skips the check.
  string etag = 4;
}

// AdvanceRolloutResponse is the advanced rollout.
message AdvanceRolloutResponse {
  // The rollout.
  Rollout rollout = 1;
}

// PauseRolloutRequest names a running rollout.
message PauseRolloutRequest {
  // The rollout's ID.
  string rollout_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// PauseRolloutResponse is the paused rollout.
message PauseRolloutResponse {
  // The rollout.
  Rollout rollout = 1;
}

// ResumeRolloutRequest names a paused rollout.
message ResumeRolloutRequest {
  // The rollout's ID.
  string rollout_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// ResumeRolloutResponse is the running rollout.
message ResumeRolloutResponse {
  // The rollout.
  Rollout rollout = 1;
}

// CancelRolloutRequest names a running or paused rollout.
message CancelRolloutRequest {
  // The rollout's ID.
  string rollout_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// CancelRolloutResponse is the cancelled rollout.
message CancelRolloutResponse {
  // The rollout.
  Rollout rollout = 1;
}

// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

package rpmgr.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "rpmgr/v1/common.proto";
import "rpmgr/v1/connector.proto";
import "rpmgr/v1/options.proto";
import "rpmgr/v1/status.proto";

option go_package = "github.com/felix-homelab/rpmgr/gen/rpmgr/v1;rpmgrv1";

// RouteService is an org's routes (docs/07-api.md, "Services"; docs/06-data-model.md, "Routes").
service RouteService {
  // CreateRoute creates a route. Its hostnames must lie under verified domains of the org.
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "org_id"
    };
  }
  // GetRoute returns a route.
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "route_id"
    };
  }
  // ListRoutes lists an org's routes by ID.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "org_id"
    };
  }
  // UpdateRoute changes the fields the mask names; a route's type does not change.
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "route.id"
    };
  }
  // CreateRouteTarget adds a target to a route: where a connector of the org sends its streams.
  rpc CreateRouteTarget(CreateRouteTargetRequest) returns (CreateRouteTargetResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "route_id"
    };
  }
  // UpdateRouteTarget changes the fields the mask names.
  rpc UpdateRouteTarget(UpdateRouteTargetRequest) returns (UpdateRouteTargetResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "target.id"
    };
  }
  // GetRouteTarget returns a target with the route it belongs to.
  rpc GetRouteTarget(GetRouteTargetRequest) returns (GetRouteTargetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "route_target_id"
    };
  }
  // DeleteRouteTarget removes a target from its route.
  rpc DeleteRouteTarget(DeleteRouteTargetRequest) returns (DeleteRouteTargetResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "route_target_id"
    };
  }
  // ProbeTargetCertificate asks a connector for the certificate a target presents, so that its user
  // can pin its key (docs/07-api.md, "Services"; ADR-0018). The connector dials the target under its
  // local policy and sends nothing but a TLS handshake.
  rpc ProbeTargetCertificate(ProbeTargetCertificateRequest) returns (ProbeTargetCertificateResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "connector_id"
    };
  }
  // PreviewRoute checks a new route, or with an update mask a change of one, as the write would,
  // and compiles it for the gateways, without saving anything.
  rpc PreviewRoute(PreviewRouteRequest) returns (PreviewRouteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "org_id"
    };
  }
  // DeleteRoute deletes a route with its hostnames, targets and port.
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "route_id"
    };
  }
}

// Route is one route of an org.
message Route {
  // The route's ID, rt_…; output only.
  string id = 1;
  // Its name, unique in the org.
  string name = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"}
  }];
  // The gateway group that serves it; set at creation.
  string gateway_group_id = 3;
  // Whether it is served: the only desired on/off switch.
  bool enabled = 4;
  // Its labels.
  map<string, string> labels = 5 [(buf.validate.field).map = {
    max_pairs: 32
    keys: {
      string: {pattern: "^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$"}
    }
    values: {
      string: {max_len: 255}
    }
  }];
  // A description for people.
  string description = 6 [(buf.validate.field).string.max_len = 1024];
  // What it serves; its type is set at creation.
  oneof spec {
    // An HTTP route, TLS terminated at the gateway.
    HTTPRouteSpec http = 10;
    // A TCP route on a public port of the group.
    TCPRouteSpec tcp = 11;
    // A UDP route on a public port of the group.
    UDPRouteSpec udp = 12;
    // A TLS route passed through by SNI, TLS ending at the target.
    TLSPassthroughRouteSpec tls_passthrough = 13;
    // A route on one public port number of the group, with both TCP and UDP.
    TCPUDPRouteSpec tcp_udp = 14;
  }
  // Its targets, by priority; output only: they change with the target methods.
  repeated RouteTarget targets = 20;
  // The access policies it applies, each once (docs/03-connections.md, "Access policies"), kept in
  // the order given, which does not change who is admitted: a deny rule of any of them wins over
  // every allow rule. A policy with a basic_auth rule only on an http route.
  repeated string policy_ids = 21 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
  }];
  // Its transport policy; the connector's if not set (docs/03-connections.md, "Transport
  // selection").
  DataTransport transport = 23 [(buf.validate.field).enum.defined_only = true];
  // When it was created and last changed; output only.
  google.protobuf.Timestamp create_time = 24;
  // When it was last changed; output only.
  google.protobuf.Timestamp update_time = 25;
  // The user who created or last changed it, empty for the system; output only. The UI names them
  // when a save meets a newer version (docs/09-web-ui.md, U6).
  string update_user_id = 26;
  // Phase 2: the route's health check, which each connector runs against each of its targets of
  // the route (docs/03-connections.md, "Target health"); unset, every target counts as healthy.
  HealthCheck health_check = 27;
  // The version to send back with an update; output only.
  string etag = 30;
  // What the agents report about it, with GetRoute and ListRoutes; output only.
  RouteStatus status = 31;
}

// RouteState is a route's status, derived from what its agents report (docs/06-data-model.md,
// "Derived route status").
enum RouteState {
  // Not derived.
  ROUTE_STATE_UNSPECIFIED = 0;
  // It is not enabled.
  ROUTE_STATE_DISABLED = 1;
  // An online agent of it has not applied its latest change yet.
  ROUTE_STATE_PENDING = 2;
  // Every enabled target is ready, and every enabled gateway of the group serves it.
  ROUTE_STATE_READY = 3;
  // A target is ready and a gateway serves it, but not all of them.
  ROUTE_STATE_DEGRADED = 4;
  // No target is ready, or no gateway serves it.
  ROUTE_STATE_UNAVAILABLE = 5;
  // An online agent of it rejected the snapshot with its latest change.
  ROUTE_STATE_ERROR = 6;
  // An http route in maintenance: its gateways answer every request with the maintenance page.
  ROUTE_STATE_MAINTENANCE = 7;
}

// RouteStatus is what a route's agents report: the gateways of its group and the connectors of its
// enabled targets.
message RouteStatus {
  // The state.
  RouteState state = 1;
  // How many targets are enabled.
  int32 targets_total = 2;
  // How many of them are ready: the connector is online and reports the route ready and, with a
  // health check, the target healthy.
  int32 targets_ready = 3;
  // How many gateways of the group are enabled.
  int32 gateways_total = 4;
  // How many of them serve it: online, reporting it ready, with a data session to the connector
  // of a ready target.
  int32 gateways_serving = 5;
  // The targets that are not ready and the gateways that do not serve it, with the reason.
  repeated RouteNotServing not_serving = 6;
  // With ERROR: the agents that rejected the snapshot, with their reasons.
  repeated AgentApplyStatus rejections = 7;
  // Phase 2, a route with a health check: its targets whose connector runs no checks, as it is of
  // an earlier release, so they count as healthy without being checked (D133).
  repeated string health_not_checked = 8;
}

// HealthCheck is a route's active health check (docs/03-connections.md, "Target health"). A value
// of 0 takes the default of docs/03-connections.md, "Timeouts, keepalive and backoff".
message HealthCheck {
  // TCP: the dial succeeds; HTTP: a GET of http_path answers with an expected status.
  HealthCheckType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The port to check instead of each target's; required on udp routes.
  uint32 port = 2 [(buf.validate.field).uint32.lte = 65535];
  // HTTP: the path and query, starting with "/"; "/" if empty.
  string http_path = 3 [(buf.validate.field).string.max_len = 1024];
  // HTTP: the passing statuses, 200 to 399 unless both are set.
  uint32 expected_status_min = 4 [(buf.validate.field).uint32.lte = 599];
  uint32 expected_status_max = 5 [(buf.validate.field).uint32.lte = 599];
  // How often each target is checked, and how long one check may take, below the interval.
  uint32 interval_seconds = 6 [(buf.validate.field).uint32.lte = 3600];
  uint32 timeout_seconds = 7 [(buf.validate.field).uint32.lte = 3600];
  // Failed checks in a row that make a target unhealthy, and passed ones that make it healthy.
  uint32 unhealthy_threshold = 8 [(buf.validate.field).uint32.lte = 10];
  uint32 healthy_threshold = 9 [(buf.validate.field).uint32.lte = 10];
}

// HealthCheckType is what a health check checks.
enum HealthCheckType {
  // Not set.
  HEALTH_CHECK_TYPE_UNSPECIFIED = 0;
  // The dial succeeds.
  HEALTH_CHECK_TYPE_TCP = 1;
  // An HTTP GET answers with an expected status.
  HEALTH_CHECK_TYPE_HTTP = 2;
}

// RouteNotServing is a target that is not ready, or a gateway that does not serve a route.
message RouteNotServing {
  // The target's or the gateway's ID.
  string id = 1;
  // OFFLINE (no control session), DISABLED (the connector or gateway), NO_DATA_SESSION (with the
  // connector of a ready target), CAPABILITY_MISSING (its release lacks a capability the route
  // needs, so its snapshot leaves the route out), or the agent's own reason, as in
  // NotReadyResource.
  string reason = 2;
  // The agent's details; with CAPABILITY_MISSING, the capabilities it lacks.
  string detail = 3;
}

// TLSMode is where an http route's certificate comes from.
enum TLSMode {
  // Not set: ACME.
  TLS_MODE_UNSPECIFIED = 0;
  // Issued by ACME for the hostnames; not for a wildcard hostname in Phase 1 (R42).
  TLS_MODE_ACME = 1;
  // An uploaded certificate.
  TLS_MODE_CERTIFICATE = 2;
}

// Port80Mode is what an http route's hostnames do on port 80; ACME HTTP-01 is always answered.
enum Port80Mode {
  // Not set: redirect.
  PORT80_MODE_UNSPECIFIED = 0;
  // Redirect to HTTPS, keeping path and query.
  PORT80_MODE_REDIRECT = 1;
  // Serve the route over plain HTTP too.
  PORT80_MODE_SERVE = 2;
  // Close the connection.
  PORT80_MODE_OFF = 3;
}

// HTTPRouteSpec is an http route (docs/03-connections.md, "HTTP routes").
message HTTPRouteSpec {
  // Its hostnames: names under verified domains of the org, or *.<name> under a wildcard one.
  repeated string hostnames = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 255
      }
    }
  }];
  // The path prefix it serves under its hostnames; the longest prefix wins. Empty is every path.
  string path_prefix = 2 [(buf.validate.field).string = {
    max_len: 1024
    pattern: "^(/[^\\s]*)?$"
  }];
  // Where its certificate comes from.
  TLSMode tls_mode = 3 [(buf.validate.field).enum.defined_only = true];
  // The uploaded certificate, with TLS_MODE_CERTIFICATE.
  string certificate_id = 4;
  // What its hostnames do on port 80.
  Port80Mode port80 = 5 [(buf.validate.field).enum.defined_only = true];
  // Strict-Transport-Security max-age; 0 sends none.
  uint32 hsts_max_age_seconds = 6 [(buf.validate.field).uint32.lte = 63072000];
  // The Host header towards the upstream: empty or "preserve" keeps the client's.
  string host_header = 7 [(buf.validate.field).string.max_len = 255];
  // Request headers set towards the upstream.
  map<string, string> request_headers_set = 8 [(buf.validate.field).map.max_pairs = 32];
  // Response headers set towards the client.
  map<string, string> response_headers_set = 9 [(buf.validate.field).map.max_pairs = 32];
  // Whether WebSocket upgrades pass; true if not set.
  optional bool websocket = 10;
  // The largest request body; 0 is no limit.
  uint64 max_body_bytes = 11;
  // Whether it is in maintenance: its gateways answer every request a client's access policies
  // admit with the maintenance page, 503, and send nothing to its targets.
  bool maintenance = 12;
  // Plain text the maintenance page shows, such as when the service is back: line feeds are its
  // only control characters, and the bidirectional embeddings, overrides and isolates
  // (U+202A-U+202E, U+2066-U+2069) are refused too.
  string maintenance_message = 13 [(buf.validate.field).string = {
    max_len: 500
    pattern: "^[^\\x00-\\x09\\x0B-\\x1F\\x7F-\\x9F]*$"
  }];
}

// TCPRouteSpec is a tcp route: a public port of the gateway group, from its TCP port pools.
message TCPRouteSpec {
  // The port; 0 on create is a random free port of the pools. Within the org's quota.
  uint32 port = 1 [(buf.validate.field).uint32.lte = 65535];
  // A connection without traffic for this long is closed; 0 never; 3600 if not set.
  optional uint32 idle_timeout_seconds = 2 [(buf.validate.field).uint32.lte = 604800];
}

// UDPRouteSpec is a udp route: a public port of the gateway group, from its UDP port pools.
message UDPRouteSpec {
  // The port; 0 on create is a random free port of the pools. Within the org's quota.
  uint32 port = 1 [(buf.validate.field).uint32.lte = 65535];
  // A flow without datagrams for this long is forgotten; 60 if not set.
  optional uint32 flow_idle_timeout_seconds = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 86400
  }];
}

// TCPUDPRouteSpec is a tcp_udp route: one public port number of the gateway group, taken from both
// its TCP and its UDP port pools; TCP connections and UDP flows on it go to the same targets.
message TCPUDPRouteSpec {
  // The port, the same for TCP and UDP; 0 on create is a random port free in both. Within the
  // org's TCP and UDP quotas.
  uint32 port = 1 [(buf.validate.field).uint32.lte = 65535];
  // A TCP connection without traffic for this long is closed; 0 never; 3600 if not set.
  optional uint32 idle_timeout_seconds = 2 [(buf.validate.field).uint32.lte = 604800];
  // A UDP flow without datagrams for this long is forgotten; 60 if not set.
  optional uint32 flow_idle_timeout_seconds = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 86400
  }];
}

// TLSPassthroughRouteSpec is a tls_passthrough route: the gateway reads the SNI and passes the
// connection through.
message TLSPassthroughRouteSpec {
  // Its hostnames, under verified domains of the org; none is any other route's in the group.
  repeated string hostnames = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 255
      }
    }
  }];
}

// UpstreamProtocol is how a connector speaks to a target.
enum UpstreamProtocol {
  // Not set: TCP for tcp, udp, tcp_udp and tls_passthrough routes, HTTP for http routes.
  UPSTREAM_PROTOCOL_UNSPECIFIED = 0;
  // The bytes as they come, for tcp and tls_passthrough routes; datagrams for udp routes; both for
  // tcp_udp routes.
  UPSTREAM_PROTOCOL_TCP = 1;
  // Plain HTTP, for http routes.
  UPSTREAM_PROTOCOL_HTTP = 2;
  // HTTPS, for http routes; its TLS settings say how the certificate is checked.
  UPSTREAM_PROTOCOL_HTTPS = 3;
  // HTTP/2 without TLS, for http routes.
  UPSTREAM_PROTOCOL_H2C = 4;
}

// ProxyProtocol is the PROXY protocol header a connector sends a target before the client's bytes.
enum ProxyProtocol {
  // Not set: none.
  PROXY_PROTOCOL_UNSPECIFIED = 0;
  // None.
  PROXY_PROTOCOL_NONE = 1;
  // Version 1, text.
  PROXY_PROTOCOL_V1 = 2;
  // Version 2, binary.
  PROXY_PROTOCOL_V2 = 3;
}

// RouteTarget is where a route's streams go: a connector of the org and an address it dials.
message RouteTarget {
  // The target's ID, tg_…; output only.
  string id = 1;
  // The connector that dials it; set at creation.
  string connector_id = 2;
  // The address, as the connector reaches it; its local policy must allow it.
  oneof address {
    // A host and port.
    HostPort host_port = 3;
    // A Unix socket, an absolute path.
    string unix_path = 4 [(buf.validate.field).string = {
      max_len: 1024
      pattern: "^/"
    }];
  }
  // How the connector speaks to it.
  UpstreamProtocol upstream_protocol = 5 [(buf.validate.field).enum.defined_only = true];
  // How an HTTPS upstream is verified.
  UpstreamTLSSettings tls = 6;
  // The PROXY protocol header, for tcp and tls_passthrough routes, and for the TCP connections of
  // a tcp_udp route; never on UDP.
  ProxyProtocol proxy_protocol = 7 [(buf.validate.field).enum.defined_only = true];
  // Its share among the targets of its priority, 1 to 1000; 1 if not set.
  uint32 weight = 8 [(buf.validate.field).uint32.lte = 1000];
  // Lower is preferred; a higher priority is a failover.
  uint32 priority = 9 [(buf.validate.field).uint32.lte = 1000];
  // Whether streams go to it.
  bool enabled = 10;
  // The version to send back with an update; output only.
  string etag = 11;
}

// HostPort is a host and a port.
message HostPort {
  // A host name or an IP address.
  string host = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
  // The port.
  uint32 port = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
}

// UpstreamTLSSettings verify an HTTPS upstream.
message UpstreamTLSSettings {
  // The name its certificate must hold, and the name sent to it (SNI); the target's host if not
  // set.
  string server_name = 1 [(buf.validate.field).string.max_len = 253];
  // The CA bundle its certificate must chain to; the gateway host's roots if not set. Only with
  // VERIFIED.
  string ca_bundle_id = 2;
  // The SHA-256 of its public key, 64 hexadecimal digits, which it must match if set. Not with
  // UNVERIFIED; needed with PINNED_KEY.
  string spki_sha256 = 3 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
  // How its certificate is checked; VERIFIED if not set.
  UpstreamVerification verification = 4 [(buf.validate.field).enum.defined_only = true];
}

// UpstreamVerification is how the gateway checks an HTTPS upstream's certificate
// (docs/04-security.md, "HTTPS upstreams"; ADR-0017, ADR-0018).
enum UpstreamVerification {
  // Not set: VERIFIED.
  UPSTREAM_VERIFICATION_UNSPECIFIED = 0;
  // Its chain against the CA bundle or the gateway host's roots, its name against the server name,
  // and its key against the pin if one is set.
  UPSTREAM_VERIFICATION_VERIFIED = 1;
  // Not at all: the traffic is encrypted, but anyone on the path from the connector to the target
  // can read and change it. The target's user chose this, for a certificate nothing can verify.
  UPSTREAM_VERIFICATION_UNVERIFIED = 2;
  // Only its key, against the pin, which must be set: neither the chain nor the name. The pin is
  // usually the key the target presents now (ProbeTargetCertificate); a new key fails until it is
  // pinned.
  UPSTREAM_VERIFICATION_PINNED_KEY = 3;
}

// ProbeTargetCertificateRequest names a target as a connector of the org reaches it.
message ProbeTargetCertificateRequest {
  // The connector that dials the target.
  string connector_id = 1 [(buf.validate.field).string.min_len = 1];
  // The target.
  oneof address {
    option (buf.validate.oneof).required = true;
    // A host and port.
    HostPort host_port = 2;
    // A Unix socket, an absolute path.
    string unix_path = 3 [(buf.validate.field).string = {
      max_len: 1024
      pattern: "^/"
    }];
  }
  // The name sent to it (SNI); the host if not set and the host is a name.
  string server_name = 4 [(buf.validate.field).string.max_len = 253];
}

// ProbeTargetCertificateResponse is the certificate the target presented.
message ProbeTargetCertificateResponse {
  // The certificate.
  TargetCertificate certificate = 1;
}

// TargetCertificate describes a certificate a target presented.
message TargetCertificate {
  // The SHA-256 of its public key (SubjectPublicKeyInfo), 64 hexadecimal digits: the pin.
  string spki_sha256 = 1;
  // The SHA-256 of the whole certificate, 64 hexadecimal digits.
  string sha256 = 2;
  // Its subject and issuer, as distinguished names.
  string subject = 3;
  string issuer = 4;
  // The DNS names and IP addresses it names.
  repeated string dns_names = 5;
  repeated string ip_addresses = 6;
  // When it is valid.
  google.protobuf.Timestamp not_before = 7;
  google.protobuf.Timestamp not_after = 8;
  // Whether it is signed by its own key.
  bool self_signed = 9;
}

// CreateRouteRequest is a new route.
message CreateRouteRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // The route; its ID and etag are ignored. enabled is ignored too: a new route is enabled.
  Route route = 2 [(buf.validate.field).required = true];
  // Makes retries idempotent (docs/07-api.md, "Resource design").
  string request_id = 3 [(buf.validate.field).string.max_len = 128];
}

// CreateRouteResponse is the new route.
message CreateRouteResponse {
  // The route.
  Route route = 1;
  // The configuration revision of the change.
  Revision revision = 2;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 3;
}

// GetRouteRequest names a route.
message GetRouteRequest {
  // The route's ID.
  string route_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetRouteResponse is the route.
message GetRouteResponse {
  // The route.
  Route route = 1;
}

// ListRoutesRequest pages through an org's routes.
message ListRoutesRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // Only this gateway group's, if set.
  string gateway_group_id = 2;
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 3;
  // The page after the one that returned it.
  string page_token = 4;
}

// ListRoutesResponse is one page of routes.
message ListRoutesResponse {
  // The routes.
  repeated Route routes = 1;
  // The token of the next page; empty after the last.
  string next_page_token = 2;
}

// UpdateRouteRequest is a changed route.
message UpdateRouteRequest {
  // The route with its ID and the new values of the fields the mask names.
  Route route = 1 [(buf.validate.field).required = true];
  // The fields to change: name, enabled, labels, description, transport, and the fields of the
  // route's spec by their paths, such as http.hostnames or tls_passthrough.hostnames.
  google.protobuf.FieldMask update_mask = 2;
  // The etag the caller read; empty skips the check.
  string etag = 3;
}

// UpdateRouteResponse is the changed route.
message UpdateRouteResponse {
  // The route.
  Route route = 1;
  // The configuration revision of the change.
  Revision revision = 2;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 3;
}

// DeleteRouteRequest names a route.
message DeleteRouteRequest {
  // The route's ID.
  string route_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// DeleteRouteResponse is the revision of the deletion.
message DeleteRouteResponse {
  // The configuration revision of the change.
  Revision revision = 1;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 2;
}

// CreateRouteTargetRequest is a new target.
message CreateRouteTargetRequest {
  // The route.
  string route_id = 1 [(buf.validate.field).string.min_len = 1];
  // The target; its ID and etag are ignored. A new target is enabled.
  RouteTarget target = 2 [(buf.validate.field).required = true];
  // Makes retries idempotent (docs/07-api.md, "Resource design").
  string request_id = 3 [(buf.validate.field).string.max_len = 128];
}

// CreateRouteTargetResponse is the new target.
message CreateRouteTargetResponse {
  // The target.
  RouteTarget target = 1;
  // The configuration revision of the change.
  Revision revision = 2;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 3;
}

// UpdateRouteTargetRequest is a changed target.
message UpdateRouteTargetRequest {
  // The target with its ID and the new values of the fields the mask names.
  RouteTarget target = 1 [(buf.validate.field).required = true];
  // The fields to change: host_port, unix_path, upstream_protocol, tls, proxy_protocol, weight,
  // priority, enabled.
  google.protobuf.FieldMask update_mask = 2;
  // The etag the caller read; empty skips the check.
  string etag = 3;
}

// UpdateRouteTargetResponse is the changed target.
message UpdateRouteTargetResponse {
  // The target.
  RouteTarget target = 1;
  // The configuration revision of the change.
  Revision revision = 2;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 3;
}

// GetRouteTargetRequest names a target.
message GetRouteTargetRequest {
  // The target's ID.
  string route_target_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetRouteTargetResponse is the target.
message GetRouteTargetResponse {
  // The target.
  RouteTarget target = 1;
  // The ID of its route.
  string route_id = 2;
}

// DeleteRouteTargetRequest names a target.
message DeleteRouteTargetRequest {
  // The target's ID.
  string route_target_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// DeleteRouteTargetResponse is the revision of the deletion.
message DeleteRouteTargetResponse {
  // The configuration revision of the change.
  Revision revision = 1;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 2;
}

// PreviewRouteRequest is a route to check: a new one, or with route.id and update_mask a change of
// one.
message PreviewRouteRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // The route, as CreateRoute or UpdateRoute takes it.
  Route route = 2 [(buf.validate.field).required = true];
  // The fields of an update; empty previews a new route.
  google.protobuf.FieldMask update_mask = 3;
  // The etag of an update; empty skips the check.
  string etag = 4;
}

// PreviewRouteResponse is what the write would do. A write it would refuse is answered with the
// error the write would give.
message PreviewRouteResponse {
  // The route as it would be stored, without an ID for a new one.
  Route route = 1;
  // The gateways that would serve it.
  repeated string gateway_ids = 2;
  // The connectors its streams would go to.
  repeated string connector_ids = 3;
  // What a gateway would refuse in its snapshot with the route; empty if nothing.
  repeated ApplyError problems = 4;
}

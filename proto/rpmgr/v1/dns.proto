syntax = "proto3";

package rpmgr.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "rpmgr/v1/domain.proto";
import "rpmgr/v1/options.proto";

option go_package = "github.com/felix-homelab/rpmgr/gen/rpmgr/v1;rpmgrv1";

// DnsProviderService is an org's connected DNS provider accounts (docs/07-api.md;
// docs/15-dns.md, "Connecting, importing and disconnecting"). Every method needs
// infrastructure.write, so Owners and Admins only. The provider's API token is write-only: it goes
// in with ConnectDnsProvider or a rotation by UpdateDnsProvider and no response, export, audit
// entry or log shows it again. Connecting, rotating and deleting need a step-up.
service DnsProviderService {
  // ConnectDnsProvider checks the token at the provider and stores it sealed. A token the
  // provider does not accept is not stored; a Global API Key is refused.
  rpc ConnectDnsProvider(ConnectDnsProviderRequest) returns (ConnectDnsProviderResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "org_id"
      step_up: true
    };
  }
  // GetDnsProvider returns a provider without its token.
  rpc GetDnsProvider(GetDnsProviderRequest) returns (GetDnsProviderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_provider_id"
    };
  }
  // ListDnsProviders lists an org's providers by ID, without their tokens.
  rpc ListDnsProviders(ListDnsProvidersRequest) returns (ListDnsProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "org_id"
    };
  }
  // UpdateDnsProvider renames a provider or rotates its token. The new token is checked first and
  // replaces the old one only if the provider accepts it; the provider's zones and everything
  // that depends on it stay. A rotation needs a step-up.
  rpc UpdateDnsProvider(UpdateDnsProviderRequest) returns (UpdateDnsProviderResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_provider.id"
    };
  }
  // DeleteDnsProvider removes a provider and its token. It is refused while zones are imported
  // from it. The records at the provider stay.
  rpc DeleteDnsProvider(DeleteDnsProviderRequest) returns (DeleteDnsProviderResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_provider_id"
      step_up: true
    };
  }
  // ListProviderZones lists the zones the token can see, read live from the provider.
  // UNAVAILABLE if the provider cannot be reached.
  rpc ListProviderZones(ListProviderZonesRequest) returns (ListProviderZonesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_provider_id"
    };
  }
}

// ProviderStatus is what the last check of a provider's token found.
enum ProviderStatus {
  // Not set.
  PROVIDER_STATUS_UNSPECIFIED = 0;
  // The provider accepted the token.
  PROVIDER_STATUS_OK = 1;
  // The provider refuses the token, or it is expired or disabled.
  PROVIDER_STATUS_INVALID = 2;
}

// CloudflareProvider is a Cloudflare account.
message CloudflareProvider {
  // The API token. Write-only: it is never returned.
  string api_token = 1 [(rpmgr.v1.sensitive) = true];
  // Set only for an account-owned token, which is checked at the account.
  string account_id = 2 [(buf.validate.field).string.max_len = 64];
}

// DnsProvider is a connected provider account. It never carries the token.
message DnsProvider {
  // The provider's ID, dnp_…; output only.
  string id = 1;
  // The name, unique in the org.
  string name = 2 [(buf.validate.field).string.max_len = 64];
  // The kind and its settings.
  oneof kind {
    // A Cloudflare account.
    CloudflareProvider cloudflare = 10;
  }
  // What the last check of the token found; output only.
  ProviderStatus status = 30;
  // When the token expires; output only. Unset for a token that does not expire.
  google.protobuf.Timestamp token_expires_at = 31;
  // The version to send back with an update or a deletion; output only.
  string etag = 32;
  // When the token was last checked; output only.
  google.protobuf.Timestamp last_check_time = 33;
  // Why the token is invalid; output only, empty while it is ok.
  string last_error = 34;
  // Whether the token expires within the warning period of docs/15-dns.md; output only.
  bool token_expiring = 35;
}

// ProviderZone is a zone the provider lists, before it is imported: the provider's ID, the apex,
// and the provider's status (such as active or pending) and type (such as full or partial).
message ProviderZone {
  string id = 1;
  string name = 2;
  string status = 3;
  string type = 4;
}

// ConnectDnsProviderRequest is a new provider.
message ConnectDnsProviderRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // The provider: name and cloudflare (api_token, account_id).
  DnsProvider dns_provider = 2 [(buf.validate.field).required = true];
}

// ConnectDnsProviderResponse is the provider, without its token.
message ConnectDnsProviderResponse {
  DnsProvider dns_provider = 1;
}

// GetDnsProviderRequest names a provider.
message GetDnsProviderRequest {
  // The provider's ID.
  string dns_provider_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetDnsProviderResponse is the provider, without its token.
message GetDnsProviderResponse {
  DnsProvider dns_provider = 1;
}

// ListDnsProvidersRequest asks for a page of an org's providers.
message ListDnsProvidersRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 2;
  // The page after the one that returned it.
  string page_token = 3;
}

// ListDnsProvidersResponse is one page of providers; the page token is empty on the last.
message ListDnsProvidersResponse {
  repeated DnsProvider dns_providers = 1;
  string next_page_token = 2;
}

// UpdateDnsProviderRequest changes a provider.
message UpdateDnsProviderRequest {
  // The provider with its ID and the new values of the fields the mask names.
  DnsProvider dns_provider = 1 [(buf.validate.field).required = true];
  // The fields to change: name, cloudflare.api_token (a rotation, with an optional
  // cloudflare.account_id of the new token).
  google.protobuf.FieldMask update_mask = 2;
  // The etag the caller read; empty skips the check.
  string etag = 3;
}

// UpdateDnsProviderResponse is the changed provider, without its token.
message UpdateDnsProviderResponse {
  DnsProvider dns_provider = 1;
}

// DeleteDnsProviderRequest names a provider.
message DeleteDnsProviderRequest {
  // The provider's ID.
  string dns_provider_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// DeleteDnsProviderResponse is empty.
message DeleteDnsProviderResponse {}

// ListProviderZonesRequest names a provider.
message ListProviderZonesRequest {
  // The provider's ID.
  string dns_provider_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListProviderZonesResponse is every zone the token can see, by name.
message ListProviderZonesResponse {
  repeated ProviderZone zones = 1;
}

// DnsZoneService is an org's managed DNS zones: provider zones imported into rpmgr
// (docs/07-api.md; docs/15-dns.md, "Connecting, importing and disconnecting"). Every method needs
// infrastructure.write, so Owners and Admins only.
service DnsZoneService {
  // ImportZone imports a zone of a connected provider as a managed zone, held. Only a zone that
  // the provider calls active and full can be imported. The import creates the claim on the
  // zone's apex, wildcard included, unless the org has a verified domain that covers it; a zone
  // that is pending at the provider, or that another org claimed, is not imported, and a zone at
  // the provider is no proof of ownership: the claim is verified like any other.
  rpc ImportZone(ImportZoneRequest) returns (ImportZoneResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_provider_id"
    };
  }
  // GetZone returns a managed zone.
  rpc GetZone(GetZoneRequest) returns (GetZoneResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
    };
  }
  // ListZones lists an org's managed zones by ID.
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "org_id"
    };
  }
  // UpdateZone changes the gates and the default TTL of a zone.
  rpc UpdateZone(UpdateZoneRequest) returns (UpdateZoneResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone.id"
    };
  }
  // RemoveZone stops managing a zone. The records stay at the provider, and the apex claim stays.
  rpc RemoveZone(RemoveZoneRequest) returns (RemoveZoneResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
    };
  }
  // PlanZoneSync computes the plan of a zone now: what a pass would create, change and delete, the
  // conflicts it found, the records that carry this instance's marker without a ledger row, and the
  // hash an approval is bound to. The provider's records are read live and nothing is written.
  rpc PlanZoneSync(PlanZoneSyncRequest) returns (PlanZoneSyncResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
    };
  }
  // SyncZone asks for a full pass over the zone now: the DNS job, on the replica that holds its
  // lease, lists the provider and reconciles at its next tick, without the debounce. The answer
  // does not wait for it.
  rpc SyncZone(SyncZoneRequest) returns (SyncZoneResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
    };
  }
  // ListZoneRecords lists the records rpmgr owns in a zone, from the ownership ledger, and with
  // include_foreign the other records of the zone, read live from the provider. Any member of the
  // org may list the owned records; the foreign ones, which show what else is in the zone, only
  // an Owner or Admin may ask for.
  rpc ListZoneRecords(ListZoneRecordsRequest) returns (ListZoneRecordsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "dns_zone_id"
    };
  }
  // AdoptRecords turns foreign records at names the zone publishes into owned ones: each gets a
  // ledger row that keeps its original content, and the next pass rewrites it. All or none: a
  // record that does not exist, is owned already, has a type rpmgr does not manage, or lies at a
  // name no source of the org publishes fails the call.
  rpc AdoptRecords(AdoptRecordsRequest) returns (AdoptRecordsResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
    };
  }
  // ReleaseRecord removes an owned record from the ledger, so that rpmgr never changes it again.
  // The record stays at the provider, without rpmgr's marker, or with restore it is put back to
  // the content it had when it was adopted.
  rpc ReleaseRecord(ReleaseRecordRequest) returns (ReleaseRecordResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
    };
  }
  // EnableZone moves a disabled zone, such as one that restore --dns-disabled disabled, to held.
  // It writes nothing: the zone computes plans again and needs an approved plan before the job
  // writes to the provider. It needs a step-up. A zone that is not disabled is
  // FAILED_PRECONDITION with ZONE_NOT_DISABLED.
  rpc EnableZone(EnableZoneRequest) returns (EnableZoneResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
      step_up: true
    };
  }
  // ApproveZonePlan approves the plan with the hash: the zone becomes active and the next pass
  // applies that plan and no other. It fails with PLAN_CHANGED, and nothing changes, if the plan
  // now has another hash. A zone that is not held, such as one that a restore disabled, is
  // FAILED_PRECONDITION with ZONE_NOT_HELD. It needs a step-up.
  rpc ApproveZonePlan(ApproveZonePlanRequest) returns (ApproveZonePlanResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_zone_id"
      step_up: true
    };
  }
}

// ZoneSyncState says whether the DNS job writes to a zone.
enum ZoneSyncState {
  // Not set.
  ZONE_SYNC_STATE_UNSPECIFIED = 0;
  // The job writes to the zone.
  ZONE_SYNC_STATE_ACTIVE = 1;
  // The job computes plans and writes nothing until a plan is approved.
  ZONE_SYNC_STATE_HELD = 2;
  // The job does nothing in the zone.
  ZONE_SYNC_STATE_DISABLED = 3;
}

// ZoneProviderStatus is what the last call to the provider found for a zone.
enum ZoneProviderStatus {
  // Not set.
  ZONE_PROVIDER_STATUS_UNSPECIFIED = 0;
  // The provider accepts the token for the zone.
  ZONE_PROVIDER_STATUS_OK = 1;
  // The provider refuses the token access to the zone.
  ZONE_PROVIDER_STATUS_PERMISSION_DENIED = 2;
  // The provider could not be reached.
  ZONE_PROVIDER_STATUS_UNREACHABLE = 3;
  // The provider rate-limits requests.
  ZONE_PROVIDER_STATUS_RATE_LIMITED = 4;
}

// DnsZone is a managed zone.
message DnsZone {
  // The zone's ID, dnz_…; output only.
  string id = 1;
  // The zone's apex; output only.
  string name = 2;
  // The provider it is imported from, dnp_…; output only.
  string dns_provider_id = 3;
  // The provider's ID of the zone; output only.
  string provider_zone_id = 4;
  // Whether the DNS job writes to the zone; output only. A zone starts held.
  ZoneSyncState sync_state = 5;
  // Why the zone is held, such as imported; output only, empty if it is not held.
  string held_reason = 6;
  // What the last call to the provider found; output only.
  ZoneProviderStatus provider_status = 7;
  // Whether route hostnames are published in the zone (docs/15-dns.md, "Publication rules").
  bool publish_route_hostnames = 8;
  // Whether routes in the zone may be proxied.
  bool allow_proxied = 9;
  // Whether wildcard names in the zone are published.
  bool allow_wildcards = 10;
  // How many names a pass may remove before it holds the zone; 0 holds on every removal.
  int32 delete_threshold = 11 [(buf.validate.field).int32.gte = 0];
  // The TTL of records in seconds.
  int32 default_ttl = 12;
  // When the zone was last synchronised; output only, unset before the first pass.
  google.protobuf.Timestamp last_synced_time = 13;
  // The version to send back with an update or a removal; output only.
  string etag = 14;
  // The hash of the plan under review on a held zone, or of the approved plan an active zone has
  // not applied yet; output only, empty otherwise.
  string pending_plan_hash = 15;
}

// ImportZoneRequest names a zone at a provider.
message ImportZoneRequest {
  // The provider's ID, dnp_….
  string dns_provider_id = 1 [(buf.validate.field).string.min_len = 1];
  // The provider's ID of the zone, as ListProviderZones returns it.
  string provider_zone_id = 2 [(buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 64];
}

// ImportZoneResponse is the zone, held, and the claim on its apex.
message ImportZoneResponse {
  DnsZone dns_zone = 1;
  // The claim that covers the zone's apex with its names: the one the import created, which is
  // pending until it is verified, or the org's own that already did.
  Domain domain = 2;
}

// GetZoneRequest names a zone.
message GetZoneRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetZoneResponse is the zone.
message GetZoneResponse {
  DnsZone dns_zone = 1;
}

// ListZonesRequest asks for a page of an org's zones.
message ListZonesRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 2;
  // The page after the one that returned it.
  string page_token = 3;
}

// ListZonesResponse is one page of zones; the page token is empty on the last.
message ListZonesResponse {
  repeated DnsZone dns_zones = 1;
  string next_page_token = 2;
}

// UpdateZoneRequest changes a zone.
message UpdateZoneRequest {
  // The zone with its ID and the new values of the fields the mask names.
  DnsZone dns_zone = 1 [(buf.validate.field).required = true];
  // The fields to change: publish_route_hostnames, allow_proxied, allow_wildcards,
  // delete_threshold, default_ttl.
  google.protobuf.FieldMask update_mask = 2;
  // The etag the caller read; empty skips the check.
  string etag = 3;
}

// UpdateZoneResponse is the changed zone.
message UpdateZoneResponse {
  DnsZone dns_zone = 1;
}

// RemoveZoneRequest names a zone.
message RemoveZoneRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// RemoveZoneResponse is empty.
message RemoveZoneResponse {}

// PlanRecord is a record in a plan: the provider's ID, empty for a record to create.
message PlanRecord {
  string id = 1;
  string name = 2;
  // A, AAAA, CNAME or TXT; NS and others appear only in a conflict.
  string type = 3;
  string content = 4;
  int32 ttl = 5;
  bool proxied = 6;
}

// PlanConflict is a name the plan does not write, and the records that are in the way.
message PlanConflict {
  string name = 1;
  // foreign_address, cname_beside_data or delegated.
  string kind = 2;
  repeated PlanRecord records = 3;
}

// ZonePlan is what a pass would do in a zone (docs/15-dns.md, "The plan and its hash").
message ZonePlan {
  repeated PlanRecord creates = 1;
  // The owned record, with every field as it becomes.
  repeated PlanRecord updates = 2;
  // Owned records, as they are now.
  repeated PlanRecord deletes = 3;
  repeated PlanConflict conflicts = 4;
  // Records with this instance's marker and no ledger row; never deleted by a pass.
  repeated PlanRecord orphans = 5;
  // Created names that a foreign wildcard record covers today.
  repeated string shadows = 6;
  // The provider's IDs of ledger rows whose record is gone; a desired record is created again.
  repeated string lost = 7;
  // The SHA-256 of the plan, in lower-case hex; what ApproveZonePlan binds to.
  string hash = 8;
}

// PlanZoneSyncRequest names a zone.
message PlanZoneSyncRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
}

// PlanZoneSyncResponse is the zone and its plan.
message PlanZoneSyncResponse {
  DnsZone dns_zone = 1;
  ZonePlan plan = 2;
}

// EnableZoneRequest names a zone.
message EnableZoneRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
}

// EnableZoneResponse is the zone, held.
message EnableZoneResponse {
  DnsZone dns_zone = 1;
}

// ApproveZonePlanRequest names a zone and the plan the caller read.
message ApproveZonePlanRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
  // The hash of the plan the caller read, as PlanZoneSync returned it.
  string plan_hash = 2 [(buf.validate.field).string.len = 64];
}

// ApproveZonePlanResponse is the zone, active.
message ApproveZonePlanResponse {
  DnsZone dns_zone = 1;
}

// SyncZoneRequest names a zone.
message SyncZoneRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
}

// SyncZoneResponse is the zone.
message SyncZoneResponse {
  DnsZone dns_zone = 1;
}

// DnsRecordState is the state of a record of a zone.
enum DnsRecordState {
  // Not set.
  DNS_RECORD_STATE_UNSPECIFIED = 0;
  // The row is written and the record is being created at the provider.
  DNS_RECORD_STATE_CREATING = 1;
  // The record is as rpmgr wrote it.
  DNS_RECORD_STATE_SYNCED = 2;
  // Someone keeps changing the record; rpmgr no longer corrects it.
  DNS_RECORD_STATE_DRIFTED = 3;
  // A record with this instance's marker and no ledger row; never deleted by a pass.
  DNS_RECORD_STATE_ORPHANED = 4;
  // The provider refused the record, or the last write failed.
  DNS_RECORD_STATE_ERROR = 5;
  // The record is being deleted at the provider.
  DNS_RECORD_STATE_DELETING = 6;
  // A record rpmgr does not own; read live, and shown to an Owner or Admin only.
  DNS_RECORD_STATE_FOREIGN = 7;
}

// DnsRecord is a record of a zone: one ledger row, or a record read live from the provider.
message DnsRecord {
  // The ledger row, dnr_…; empty for a record rpmgr does not own.
  string id = 1;
  // The provider's ID of the record; empty while a record is being created.
  string provider_record_id = 2;
  string name = 3;
  // A, AAAA, CNAME or TXT; a foreign record may have another type.
  string type = 4;
  string content = 5;
  int32 ttl = 6;
  bool proxied = 7;
  // The state; output only.
  DnsRecordState state = 8;
  // Why a record is in state error or drifted; output only.
  string reason = 9;
  // When the record was adopted; output only, unset for a record rpmgr created.
  google.protobuf.Timestamp adopted_time = 10;
}

// ListZoneRecordsRequest names a zone.
message ListZoneRecordsRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
  // Also list the records rpmgr does not own, and the orphans. Owners and Admins only; for anyone
  // else the call is PERMISSION_DENIED.
  bool include_foreign = 2;
}

// ListZoneRecordsResponse holds the records, by name and type: the owned ones, then the others.
message ListZoneRecordsResponse {
  repeated DnsRecord records = 1;
}

// AdoptRecordsRequest names foreign records.
message AdoptRecordsRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
  // The provider's IDs of the records, as ListZoneRecords shows them; at most 200.
  repeated string provider_record_ids = 2 [(buf.validate.field).repeated.min_items = 1, (buf.validate.field).repeated.max_items = 200];
}

// AdoptRecordsResponse is the new ledger rows, in the order of the request.
message AdoptRecordsResponse {
  repeated DnsRecord records = 1;
}

// ReleaseRecordRequest names an owned record.
message ReleaseRecordRequest {
  // The zone's ID.
  string dns_zone_id = 1 [(buf.validate.field).string.min_len = 1];
  // The ledger row, dnr_….
  string record_id = 2 [(buf.validate.field).string.min_len = 1];
  // Put the record back to the content it had when it was adopted. For a record that was not
  // adopted the call is FAILED_PRECONDITION with RECORD_NOT_ADOPTED.
  bool restore = 3;
}

// ReleaseRecordResponse says what happened to the record at the provider.
message ReleaseRecordResponse {
  // A warning, empty if there is none: the original that was restored is older than the staleness
  // limit of docs/15-dns.md, so the address may now belong to someone else.
  string warning = 1;
}

// DnsNameService is an org's explicit DNS names (docs/07-api.md; docs/15-dns.md, "Concepts"): a
// name, or a wildcard, that points at a gateway group without a route. Reading needs org.read,
// changing a name infrastructure.write, so Owners and Admins only. A name is DNS-only, and lies
// under a verified domain of the org. The service creates and keeps the names; publishing them in
// a managed zone is the DNS job's.
service DnsNameService {
  // CreateDnsName creates a name for a gateway group of the org. The name must lie under a
  // verified domain of the org, and a wildcard name under a verified domain with the wildcard;
  // it is unique in the instance.
  rpc CreateDnsName(CreateDnsNameRequest) returns (CreateDnsNameResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "org_id"
    };
  }
  // GetDnsName returns a name.
  rpc GetDnsName(GetDnsNameRequest) returns (GetDnsNameResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "dns_name_id"
    };
  }
  // ListDnsNames lists an org's names by ID.
  rpc ListDnsNames(ListDnsNamesRequest) returns (ListDnsNamesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "org_id"
    };
  }
  // UpdateDnsName changes the gateway group or the TTL of a name. The name itself does not
  // change: create a new one.
  rpc UpdateDnsName(UpdateDnsNameRequest) returns (UpdateDnsNameResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_name.id"
    };
  }
  // DeleteDnsName deletes a name. The records the DNS job published for it go with it.
  rpc DeleteDnsName(DeleteDnsNameRequest) returns (DeleteDnsNameResponse) {
    option (rpmgr.v1.authz) = {
      permission: "infrastructure.write"
      resource_field: "dns_name_id"
    };
  }
}

// DnsName is an explicit DNS name of an org.
message DnsName {
  // The name's ID, dnn_…; output only.
  string id = 1;
  // The name: a host name, or a wildcard whose first label is *. It is stored in lower case
  // without a trailing dot, and cannot change.
  string fqdn = 2 [(buf.validate.field).string.max_len = 253];
  // The gateway group the name points at, which is one of the org's own.
  string gateway_group_id = 3;
  // The TTL of the name's records in seconds; 0 is the default TTL of the zone.
  int32 ttl = 4 [(buf.validate.field).int32.gte = 0];
  // The version to send back with an update or a deletion; output only.
  string etag = 5;
}

// CreateDnsNameRequest is a new name.
message CreateDnsNameRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // The name: fqdn, gateway_group_id and an optional ttl.
  DnsName dns_name = 2 [(buf.validate.field).required = true];
  // Makes retries idempotent (docs/07-api.md, "Resource design").
  string request_id = 3 [(buf.validate.field).string.max_len = 128];
}

// CreateDnsNameResponse is the new name.
message CreateDnsNameResponse {
  DnsName dns_name = 1;
}

// GetDnsNameRequest names a name.
message GetDnsNameRequest {
  // The name's ID.
  string dns_name_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetDnsNameResponse is the name.
message GetDnsNameResponse {
  DnsName dns_name = 1;
}

// ListDnsNamesRequest asks for a page of an org's names.
message ListDnsNamesRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 2;
  // The page after the one that returned it.
  string page_token = 3;
}

// ListDnsNamesResponse is one page of names; the page token is empty on the last.
message ListDnsNamesResponse {
  repeated DnsName dns_names = 1;
  string next_page_token = 2;
}

// UpdateDnsNameRequest changes a name.
message UpdateDnsNameRequest {
  // The name with its ID and the new values of the fields the mask names.
  DnsName dns_name = 1 [(buf.validate.field).required = true];
  // The fields to change: gateway_group_id, ttl.
  google.protobuf.FieldMask update_mask = 2;
  // The etag the caller read; empty skips the check.
  string etag = 3;
}

// UpdateDnsNameResponse is the changed name.
message UpdateDnsNameResponse {
  DnsName dns_name = 1;
}

// DeleteDnsNameRequest names a name.
message DeleteDnsNameRequest {
  // The name's ID.
  string dns_name_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// DeleteDnsNameResponse is empty.
message DeleteDnsNameResponse {}

syntax = "proto3";

package rpmgr.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "rpmgr/v1/common.proto";
import "rpmgr/v1/options.proto";
import "rpmgr/v1/status.proto";

option go_package = "github.com/felix-homelab/rpmgr/gen/rpmgr/v1;rpmgrv1";

// PolicyService is an org's access policies (docs/07-api.md, "Services"; docs/03-connections.md,
// "Access policies"). A deny rule of any policy a route applies wins over every allow rule, in
// whatever order the policies and their rules come; a CIDR is kept in its masked form.
service PolicyService {
  // CreateAccessPolicy creates an access policy. The controller hashes the passwords of its
  // basic_auth users and keeps only the hashes.
  rpc CreateAccessPolicy(CreateAccessPolicyRequest) returns (CreateAccessPolicyResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "org_id"
    };
  }
  // GetAccessPolicy returns an access policy, without passwords.
  rpc GetAccessPolicy(GetAccessPolicyRequest) returns (GetAccessPolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "access_policy_id"
    };
  }
  // ListAccessPolicies lists an org's access policies by ID.
  rpc ListAccessPolicies(ListAccessPoliciesRequest) returns (ListAccessPoliciesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (rpmgr.v1.authz) = {
      permission: "org.read"
      resource_field: "org_id"
    };
  }
  // UpdateAccessPolicy changes the fields the mask names; rules are replaced as a whole.
  rpc UpdateAccessPolicy(UpdateAccessPolicyRequest) returns (UpdateAccessPolicyResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "access_policy.id"
    };
  }
  // DeleteAccessPolicy deletes an access policy; refused while routes apply it.
  rpc DeleteAccessPolicy(DeleteAccessPolicyRequest) returns (DeleteAccessPolicyResponse) {
    option (rpmgr.v1.authz) = {
      permission: "routes.write"
      resource_field: "access_policy_id"
    };
  }
}

// AccessPolicy is an org's list of rules that routes apply.
message AccessPolicy {
  // Its ID, ap_…; output only.
  string id = 1;
  // Its name, unique in the org.
  string name = 2 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"}
  }];
  // A description for people.
  string description = 3 [(buf.validate.field).string.max_len = 1000];
  // Its rules, kept in the order given; for IP rules the order does not matter, as a deny wins.
  repeated AccessRule rules = 4 [(buf.validate.field).repeated.max_items = 50];
  // The routes that apply it; output only.
  repeated string route_ids = 5;
  // The version to send back with an update; output only.
  string etag = 6;
}

// AccessRule is one rule of an access policy (docs/03-connections.md, "Access policies").
message AccessRule {
  // The rule.
  oneof rule {
    option (buf.validate.oneof).required = true;
    // Allows the client addresses in its CIDRs.
    IPRuleParams ip_allow = 1;
    // Denies the client addresses in its CIDRs.
    IPRuleParams ip_deny = 2;
    // On an http route, lets pass the users with their passwords.
    BasicAuthRule basic_auth = 3;
    // On an http route, lets pass only requests that carry a header with one of the values.
    RequireHeaderRule require_header = 4;
    // On every route type, limits each client's requests, new connections or new flows.
    RateLimitRule rate_limit = 5;
  }
}

// RequireHeaderRule is a require_header rule as the API takes and shows it
// (docs/03-connections.md, "Access policies"): a shared secret, such as a CDN's origin header,
// that every request must carry. The gateway removes the header before the request goes upstream.
message RequireHeaderRule {
  // The header's name: an HTTP token, compared without case. Neither one HTTP uses for framing or
  // the connection, nor Host, Authorization, Cookie or an Rpmgr- header.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
  }];
  // The accepted values, 1 to 4 so that a value can be rotated, each of 32 to 1024 visible ASCII
  // characters with at least 8 different ones. A value must be random, such as one of
  // `openssl rand -base64 32`: gateways hold its unsalted SHA-256. Write-only, never returned. In
  // an update, a rule without values keeps the values of the policy's require_header rule of that
  // name.
  repeated string values = 2 [
    (rpmgr.v1.sensitive) = true,
    (buf.validate.field).repeated = {
      max_items: 4
      items: {
        string: {max_len: 1024}
      }
    }
  ];
}

// RateLimitRule is a rate_limit rule (docs/03-connections.md, "Access policies"): each client, an
// IPv4 address or an IPv6 /64, may make per_second requests, new connections or new flows a
// second, burst of them at once, on each gateway.
message RateLimitRule {
  // Requests, new connections or new flows a second.
  uint32 per_second = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 10000
  }];
  // How many may come at once.
  uint32 burst = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 10000
  }];
}

// BasicAuthRule is a basic_auth rule as the API takes and shows it.
message BasicAuthRule {
  // The users, with distinct names.
  repeated BasicAuthCredential users = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// BasicAuthCredential is one user of a basic_auth rule.
message BasicAuthCredential {
  // The user name; no colon (RFC 7617).
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    not_contains: ":"
  }];
  // The password, 12 to 256 characters; write-only, never returned. In an update, a user without
  // one keeps the password of the user of that name in the policy's basic_auth rules.
  string password = 2 [
    (rpmgr.v1.sensitive) = true,
    (buf.validate.field).string.max_len = 1024
  ];
}

// CreateAccessPolicyRequest creates an access policy in an org.
message CreateAccessPolicyRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // The policy: its name, description and rules.
  AccessPolicy access_policy = 2 [(buf.validate.field).required = true];
  // Makes retries idempotent (docs/07-api.md, "Resource design").
  string request_id = 3 [(buf.validate.field).string.max_len = 128];
}

// CreateAccessPolicyResponse is the new policy.
message CreateAccessPolicyResponse {
  // The policy.
  AccessPolicy access_policy = 1;
  // The revision of the change.
  Revision revision = 2;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 3;
}

// GetAccessPolicyRequest names an access policy.
message GetAccessPolicyRequest {
  // The policy's ID.
  string access_policy_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetAccessPolicyResponse is the policy.
message GetAccessPolicyResponse {
  // The policy.
  AccessPolicy access_policy = 1;
}

// ListAccessPoliciesRequest pages through an org's access policies.
message ListAccessPoliciesRequest {
  // The org.
  string org_id = 1 [(buf.validate.field).string.min_len = 1];
  // At most this many, 50 if not set, 500 at most.
  int32 page_size = 2;
  // The page after the one that returned it.
  string page_token = 3;
}

// ListAccessPoliciesResponse is one page of access policies.
message ListAccessPoliciesResponse {
  // The policies.
  repeated AccessPolicy access_policies = 1;
  // The token of the next page; empty after the last.
  string next_page_token = 2;
}

// UpdateAccessPolicyRequest changes an access policy.
message UpdateAccessPolicyRequest {
  // The policy, with its ID and the fields to change.
  AccessPolicy access_policy = 1 [(buf.validate.field).required = true];
  // The fields to change: name, description, rules.
  google.protobuf.FieldMask update_mask = 2;
  // The etag the caller read; empty skips the check.
  string etag = 3;
}

// UpdateAccessPolicyResponse is the changed policy.
message UpdateAccessPolicyResponse {
  // The policy.
  AccessPolicy access_policy = 1;
  // The revision of the change.
  Revision revision = 2;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 3;
}

// DeleteAccessPolicyRequest names an access policy.
message DeleteAccessPolicyRequest {
  // The policy's ID.
  string access_policy_id = 1 [(buf.validate.field).string.min_len = 1];
  // The etag the caller read; empty skips the check.
  string etag = 2;
}

// DeleteAccessPolicyResponse is the revision of the deletion.
message DeleteAccessPolicyResponse {
  // The revision of the change.
  Revision revision = 1;
  // The apply status of the revision; with the request header Rpmgr-Wait-Applied, once it is
  // final or the wait is over (docs/07-api.md, "Writes and apply status").
  ApplyStatus apply_status = 2;
}

// PolicyRuleParams are the parameters of one rule of an access policy (docs/06-data-model.md,
// "Routing"), stored in policy_rules.params; the rule's kind decides which one is set. The kinds
// of later phases add theirs.
message PolicyRuleParams {
  // The parameters.
  oneof params {
    // ip_allow and ip_deny: the client addresses the rule matches.
    IPRuleParams ip = 1;
    // basic_auth: the users who may pass.
    BasicAuthParams basic_auth = 2;
    // require_header: the header and its accepted values.
    RequireHeaderParams require_header = 3;
    // rate_limit: the rate and burst per client.
    RateLimitRule rate_limit = 4;
  }
}

// RequireHeaderParams are a require_header rule as the controller keeps it and gateways check it
// (docs/04-security.md, "Route edge rules"): the header's canonical name and the SHA-256 of each
// accepted value, never the values.
message RequireHeaderParams {
  // The header's name in its canonical form.
  string name = 1;
  // The SHA-256 of each accepted value, 1 to 4.
  repeated bytes value_sha256 = 2 [(rpmgr.v1.sensitive) = true];
}

// BasicAuthParams are the users of a basic_auth rule (docs/04-security.md, "Secrets at rest and
// in logs"): the controller keeps their argon2id hashes, never their passwords.
message BasicAuthParams {
  // The users.
  repeated BasicAuthUser users = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

// BasicAuthUser is one user of a basic_auth rule.
message BasicAuthUser {
  // The user name; no colon (RFC 7617).
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    not_contains: ":"
  }];
  // The password's argon2id hash in PHC string format.
  string password_hash = 2 [(rpmgr.v1.sensitive) = true];
}

// IPRuleParams match client addresses.
message IPRuleParams {
  // CIDRs, IPv4 or IPv6; an IPv4-mapped IPv6 client matches the IPv4 ones.
  repeated string cidrs = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
  }];
}
